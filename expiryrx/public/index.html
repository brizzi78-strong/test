<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ExpiryRx | Expiration Intelligence</title>
<style>
:root{--navy:#07192f;--navy2:#0b2949;--blue:#1768ff;--ice:#f4f8fb;--white:#fff;--ink:#10243a;--muted:#6f8193;--line:#dce6ee;--red:#d54a52;--amber:#c98b22;--green:#0ca678;--shadow:0 18px 55px rgba(9,31,53,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#edf3f7}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:linear-gradient(180deg,#06172b,#0a2340 68%,#0b2949);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.logo{font-size:25px;font-weight:900;letter-spacing:-.04em}.logo span{font-weight:500;color:#9ecbff}.tag{font-size:11px;color:#8faac3;margin:3px 0 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b7c7d7;text-align:left;padding:12px 13px;border-radius:11px;font-weight:760;cursor:pointer}.nav button.on{background:#ffffff12;color:#fff;box-shadow:inset 3px 0 0 #55b8ff}.sidefoot{position:absolute;left:16px;right:16px;bottom:18px;border-top:1px solid #ffffff18;padding-top:14px;font-size:11px;color:#8faac3}.main{min-width:0}.topbar{height:72px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8}.eyebrow{text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.14em;color:#6d8aa5}.topTitle{font-weight:850}.sys{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#c69a2a;display:inline-block}.dot.live{background:var(--green)}.role{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink)}.content{max-width:1450px;margin:auto;padding:26px 28px 80px}.hero{border-radius:24px;background:radial-gradient(circle at 86% 12%,#1d66aa 0,#0c3157 28%,#07192f 70%);color:#fff;padding:30px;display:grid;grid-template-columns:1.7fr .8fr;gap:28px;box-shadow:0 25px 70px rgba(6,25,47,.22)}.hero h1{font-size:38px;line-height:1.05;letter-spacing:-.045em;margin:8px 0 10px}.hero p{max-width:760px;color:#c7d7e6;font-size:15px;line-height:1.55;margin:0}.heroStat{border-left:1px solid #ffffff24;padding-left:26px;display:flex;flex-direction:column;justify-content:center}.heroStat .num{font-size:40px;font-weight:900;letter-spacing:-.05em}.heroStat .lab{color:#a9c0d5;font-size:12px;line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:15px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.metric{padding:17px}.metric small{display:block;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:9px;font-weight:900}.metric b{display:block;font-size:27px;margin-top:8px;letter-spacing:-.035em}.trend{font-size:10px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1.7fr .8fr;gap:15px}.card{padding:19px;margin-top:15px}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:12px}.card h2{font-size:17px;margin:0;letter-spacing:-.02em}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;white-space:nowrap}.danger{background:#fff0f1;color:#b93740}.warn{background:#fff6e5;color:#a86d08}.good{background:#e9f8f3;color:#087b5a}.bluepill{background:#eaf2ff;color:#1559c6}.btn{border:0;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:850;cursor:pointer}.primary{background:#0a2745;color:#fff}.secondary{background:#edf3f7;color:#173c5e}.ghost{background:#fff;border:1px solid var(--line);color:#284b68}.actionList{display:grid;gap:10px}.actionCard{border:1px solid #e5edf3;border-radius:15px;padding:14px;display:grid;grid-template-columns:minmax(0,1.5fr) .8fr .65fr auto;gap:14px;align-items:center;background:#fff}.actionCard.critical{border-left:5px solid var(--red)}.actionCard.priority{border-left:5px solid var(--amber)}.product{font-size:14px;font-weight:900}.meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.45}.loc{font-size:12px;font-weight:800}.days{font-size:22px;font-weight:900;letter-spacing:-.04em}.days small{display:block;font-size:9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}.money{font-size:15px;font-weight:900}.rec{font-size:10px;color:var(--muted);margin-top:4px}.stack{display:grid;gap:8px}.flow{display:grid;gap:9px}.flowItem{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:11px;border:1px solid #edf1f4;border-radius:12px;background:#fcfdfe}.flowNum{width:28px;height:28px;border-radius:8px;background:#0b2949;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.table{overflow:auto;border:1px solid #ebf0f4;border-radius:13px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:12px 11px;border-bottom:1px solid #edf2f5;text-align:left;vertical-align:middle}th{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#7890a4;background:#f8fafc;white-space:nowrap}.prod{font-weight:800}.subline{font-size:10px;color:var(--muted);margin-top:2px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-weight:900;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.full{grid-column:1/-1}.scan{border:1px solid #cee0ee;border-radius:14px;background:linear-gradient(180deg,#f9fcfe,#f1f7fb);padding:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf2f5}.row:last-child{border:0}.toast{position:fixed;right:20px;bottom:20px;background:#07192f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 15px 45px #0004;display:none;z-index:20}.sectionTitle h1{margin:0;font-size:28px;letter-spacing:-.035em}.sectionTitle p{margin:5px 0 0;color:var(--muted)}.mobileHead{display:none}.loading{padding:50px;text-align:center;color:var(--muted)}.errorbox{background:#fff0f1;color:#a6323a;padding:14px;border-radius:12px;margin-top:15px;font-size:12px}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.side{display:none}.mobileHead{display:flex;background:#07192f;color:#fff;padding:16px 18px;justify-content:space-between;align-items:center}.mobileNav{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}.mobileNav button{border:0;border-radius:999px;padding:9px 12px;background:#f1f5f8;color:var(--muted);font-size:11px;font-weight:800}.mobileNav button.on{background:#0a2745;color:#fff}.topbar{display:none}.content{padding:18px 14px 70px}.hero{grid-template-columns:1fr}.heroStat{border-left:0;border-top:1px solid #ffffff24;padding:18px 0 0}.hero h1{font-size:31px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2,.forms{grid-template-columns:1fr}.full{grid-column:auto}.actionCard{grid-template-columns:1fr}.actionCard .stack{grid-template-columns:1fr 1fr;display:grid}.actionCard button{width:100%}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="logo">ExpiryRx <span>Intelligence</span></div><div class="tag">Expiration action command center</div><nav class="nav" id="nav"></nav><div class="sidefoot">What expires · Where it is · What to do</div></aside><div class="main"><div class="mobileHead"><div class="logo">ExpiryRx <span>Intelligence</span></div><span id="mhealth"><i class="dot"></i></span></div><div class="mobileNav" id="mnav"></div><header class="topbar"><div><div class="eyebrow">Enterprise Operations</div><div class="topTitle">Expiration Action Command Center</div></div><div class="sys"><span id="health"><i class="dot"></i> Connecting</span><select class="role" id="role"><option>Pharmacist</option><option>Technician</option><option>Pharmacy Manager</option><option>Corporate Admin</option></select></div></header><main class="content" id="app"><div class="loading">Loading ExpiryRx intelligence…</div></main></div></div><div class="toast" id="toast"></div>
<script>
const tabs=['Dashboard','Inventory','Receive','Transfers','Verification','Audit','ROI'];let current='Dashboard',state={stores:[],inventory:[],audit:[],transfers:[]},roi={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function store(id){return state.stores.find(s=>s.id===id)?.name||id}function notify(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}async function api(url,opt){const r=await fetch(url,opt);let j;try{j=await r.json()}catch(e){throw new Error('Service response error')}if(!r.ok)throw new Error(j.error||'Request failed');return j}function rec(x){if(x.days_to_expiry<=30)return'Remove / Return';if(x.days_to_expiry<=60)return'Use First / Transfer';if(x.days_to_expiry<=90)return'Transfer / Prioritize';if(x.days_to_expiry<=120)return'Watch / Redistribute';return'Routine'}function riskClass(x){return x.days_to_expiry<=30?'critical':x.days_to_expiry<=90?'priority':''}function riskPill(x){return x.days_to_expiry<=30?'<span class="pill danger">IMMEDIATE</span>':x.days_to_expiry<=90?'<span class="pill warn">PRIORITY</span>':'<span class="pill good">WATCH</span>'}async function refresh(){try{state=await api('/api/state');roi=await api('/api/roi');render()}catch(e){$('#app').innerHTML=`<div class="errorbox"><b>Data service unavailable.</b><br>${esc(e.message)}</div>`}}async function check(){try{const h=await api('/api/health');const txt=h.db==='postgres'?'Postgres live':'Pilot storage live';if($('#health'))$('#health').innerHTML=`<i class="dot live"></i> ${txt}`;if($('#mhealth'))$('#mhealth').innerHTML='<i class="dot live"></i>'}catch(e){if($('#health'))$('#health').textContent='Offline'}}function nav(){const mk=t=>`<button class="${t===current?'on':''}" data-t="${t}">${t}</button>`;$('#nav').innerHTML=tabs.map(mk).join('');$('#mnav').innerHTML=tabs.map(mk).join('');$$('[data-t]').forEach(b=>b.onclick=()=>{current=b.dataset.t;render()})}function totals(){let urgent=state.inventory.filter(x=>x.days_to_expiry<=30),priority=state.inventory.filter(x=>x.days_to_expiry>30&&x.days_to_expiry<=90),watch=state.inventory.filter(x=>x.days_to_expiry>90&&x.days_to_expiry<=120);return{urgent:urgent.length,priority:priority.length,watch:watch.length,risk:roi.inventory_at_risk_90||0}}function metrics(){let t=totals();return `<div class="metrics"><div class="metric"><small>Immediate lots</small><b>${t.urgent}</b><div class="trend">≤30 days remaining</div></div><div class="metric"><small>Priority lots</small><b>${t.priority}</b><div class="trend">31–90 days remaining</div></div><div class="metric"><small>Watch list</small><b>${t.watch}</b><div class="trend">91–120 days remaining</div></div><div class="metric"><small>Value at risk</small><b>${money(t.risk)}</b><div class="trend">Inventory inside 90 days</div></div></div>`}
function actionQueue(items){return `<div class="actionList">${items.map(x=>`<div class="actionCard ${riskClass(x)}"><div><div class="product">${esc(x.name)}</div><div class="meta">Lot <b>${esc(x.lot)}</b> · Expires <b>${esc(x.exp)}</b> · ${riskPill(x)}</div><div class="meta">${esc(store(x.store_id))} · <b>${esc(x.location||'Location not set')}</b></div></div><div class="stack"><div><div class="days">${x.days_to_expiry}<small>days remaining</small></div></div><div><div class="money">${money(Number(x.qty)*Number(x.unit_value||0))}</div><div class="meta">${x.qty} units on shelf</div></div></div><div><b>${rec(x)}</b><div class="rec">Recommended next action</div></div><button class="btn primary action" data-id="${x.id}" data-a="verify">Verified on shelf</button></div>`).join('')||'<p class="muted">No short-dated inventory requires action.</p>'}</div>`}
function Dashboard(){let q=[...state.inventory].filter(x=>x.days_to_expiry<=120).sort((a,b)=>a.days_to_expiry-b.days_to_expiry);return `<section class="hero"><div><div class="eyebrow" style="color:#83bde9">Shelf-Level Expiration Intelligence</div><h1>What is about to expire?<br>Where is it?<br>What should we do?</h1><p>ExpiryRx replaces the monthly shelf hunt with a daily exception list of exact medications, lots, locations, quantities and next actions.</p></div><div class="heroStat"><div class="eyebrow" style="color:#83bde9">Action Queue</div><div class="num">${q.length}</div><div class="lab">short-dated lots requiring attention within 120 days.</div></div></section>${metrics()}<section class="card"><div class="cardhead"><div><h2>Expiration Action Queue</h2><p class="muted">Exact product, exact lot, exact shelf location, exact deadline.</p></div><span class="pill bluepill">LIVE SHELF VIEW</span></div>${actionQueue(q)}</section><div class="grid2"><section class="card"><div class="cardhead"><div><h2>What ExpiryRx eliminates</h2><p class="muted">The manual monthly search.</p></div></div><div class="flow"><div class="flowItem"><div class="flowNum">01</div><div><b>No more walking every shelf</b><div class="subline">Teams work from the exception queue.</div></div></div><div class="flowItem"><div class="flowNum">02</div><div><b>No more guessing what to move</b><div class="subline">Velocity supports redistribution recommendations.</div></div></div><div class="flowItem"><div class="flowNum">03</div><div><b>No more hidden expiration exposure</b><div class="subline">Lot, location, quantity and value stay visible.</div></div></div></div></section><section class="card"><div class="cardhead"><div><h2>Operating model</h2><p class="muted">Simple enough for the pharmacy floor.</p></div></div><div class="flow"><div class="flowItem"><div class="flowNum">1</div><div><b>Scan at receive</b><div class="subline">Capture GTIN, lot and expiration.</div></div></div><div class="flowItem"><div class="flowNum">2</div><div><b>Store exact location</b><div class="subline">Shelf, refrigerator or cabinet.</div></div></div><div class="flowItem"><div class="flowNum">3</div><div><b>Act on exceptions</b><div class="subline">Use first, transfer, return or remove.</div></div></div></div></section></div>`}
function rows(items){return items.map(x=>`<tr><td><div class="prod">${esc(x.name)}</div><div class="subline">${esc(x.gtin||'')}</div></td><td>${esc(x.lot)}</td><td>${esc(store(x.store_id))}</td><td><b>${esc(x.location||'')}</b></td><td><b>${esc(x.exp)}</b><div class="subline">${x.days_to_expiry} days</div></td><td>${x.qty}</td><td>${money(Number(x.qty)*Number(x.unit_value||0))}</td><td>${rec(x)}</td></tr>`).join('')}function Inventory(){let inv=[...state.inventory].sort((a,b)=>a.days_to_expiry-b.days_to_expiry);return `<div class="sectionTitle"><div class="eyebrow">Shelf Inventory</div><h1>Exact lot-level inventory</h1><p>Every record ties a medication to a lot, expiration date and physical location.</p></div>${metrics()}<section class="card"><div class="table"><table><thead><tr><th>Medication</th><th>Lot</th><th>Store</th><th>Physical location</th><th>Expiration</th><th>Qty</th><th>Value</th><th>Recommended action</th></tr></thead><tbody>${rows(inv)}</tbody></table></div></section>`}
function Receive(){return `<div class="sectionTitle"><div class="eyebrow">Capture</div><h1>Receive and place inventory</h1><p>Scan once, then record the exact shelf or refrigerator location.</p></div><section class="card"><div class="scan"><h2>GS1 DataMatrix intake</h2><p class="muted">Scan or paste the product string. ExpiryRx parses GTIN, expiration and lot automatically.</p><div class="forms"><div class="field full"><label>Scan / paste GS1 string</label><input id="scan" placeholder="(01)00301694772127(17)270430(10)LOT123"></div><div><button class="btn secondary" id="parse">Parse scan</button></div></div></div><form id="recv" class="forms" style="margin-top:17px"><div class="field full"><label>Medication</label><input name="name" required></div><div class="field"><label>GTIN / NDC</label><input name="gtin"></div><div class="field"><label>Lot</label><input name="lot" required></div><div class="field"><label>Expiration</label><input type="date" name="exp" required></div><div class="field"><label>Quantity</label><input type="number" min="1" value="1" name="qty" required></div><div class="field"><label>Exact physical location</label><input name="location" placeholder="Shelf C4 / Refrigerator 1" required></div><div class="field"><label>Unit value ($)</label><input type="number" min="0" step=".01" name="unit_value" value="0"></div><div class="field"><label>Monthly utilization</label><input type="number" min="0" step=".1" name="monthly_velocity" value="0"></div><div class="field full"><label>Store</label><select name="store_id">${state.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><button class="btn primary">Save shelf record</button></div></form></section>`}
async function Transfers(){let sug=[];try{sug=await api('/api/transfers/suggestions')}catch(e){}return `<div class="sectionTitle"><div class="eyebrow">Redistribution</div><h1>Move short-dated product before it expires</h1><p>Usage velocity is used here—behind the scenes—to determine where inventory should go.</p></div><section class="card">${sug.length?sug.map(o=>`<div class="row"><div><b>${esc(o.name)}</b><div class="subline">${esc(store(o.from_store))} → ${esc(store(o.to_store))} · ${o.qty} units · ${o.days} days left · demand ${o.source_velocity}/mo → ${o.dest_velocity}/mo</div></div><div style="text-align:right"><b>${money(o.protected_value)}</b><br><button class="btn primary transfer" data-item="${o.item_id}" data-to="${o.to_store}" data-qty="${o.qty}">Approve transfer</button></div></div>`).join(''):'<p class="muted">No current transfer recommendations.</p>'}</section>`}
function Verification(){let list=[...state.inventory].filter(x=>x.days_to_expiry<=120).sort((a,b)=>a.days_to_expiry-b.days_to_expiry);return `<div class="sectionTitle"><div class="eyebrow">Physical Verification</div><h1>Verify only what matters</h1><p>Staff check the exact shelf locations in the exception queue—not the entire pharmacy.</p></div><section class="card">${actionQueue(list)}</section>`}function Audit(){return `<div class="sectionTitle"><div class="eyebrow">Governance</div><h1>Audit trail</h1><p>Every verification and inventory action is timestamped.</p></div><section class="card">${state.audit.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div>${esc(a.detail)}</div><div class="subline">${new Date(a.ts).toLocaleString()} · ${esc(a.role||'')}</div></div></div>`).join('')||'<p class="muted">No audit events yet.</p>'}</section>`}function ROI(){return `<div class="sectionTitle"><div class="eyebrow">Financial Intelligence</div><h1>ROI command center</h1><p>Measure avoided expiration loss, labor saved and inventory successfully redistributed.</p></div>${metrics()}<section class="card"><div class="grid2"><div><h2>${money(roi.inventory_protected||0)}</h2><p class="muted">Inventory protected through approved transfers.</p></div><div><h2>${roi.successful_transfers||0}</h2><p class="muted">Successful redistribution events.</p></div></div></section>`}
function bind(){nav();$$('.action').forEach(b=>b.onclick=async()=>{try{await api('/api/inventory/'+b.dataset.id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.a,role:$('#role')?.value||'Pharmacist'})});notify('Shelf verification recorded');await refresh()}catch(e){notify(e.message)}});$$('.transfer').forEach(b=>b.onclick=async()=>{try{await api('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:b.dataset.item,to_store:b.dataset.to,qty:Number(b.dataset.qty),role:$('#role')?.value||'Pharmacy Manager'})});notify('Transfer approved');await refresh()}catch(e){notify(e.message)}});if($('#parse'))$('#parse').onclick=()=>{let v=$('#scan').value,g=(v.match(/\(01\)(\d{14})/)||[])[1],e=(v.match(/\(17\)(\d{6})/)||[])[1],l=(v.match(/\(10\)([^()]+)/)||[])[1],f=$('#recv');if(g)f.gtin.value=g;if(l)f.lot.value=l;if(e){let yy=2000+Number(e.slice(0,2)),mm=e.slice(2,4),dd=e.slice(4,6);f.exp.value=`${yy}-${mm}-${dd}`}notify('Scan parsed')};if($('#recv'))$('#recv').onsubmit=async ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());d.qty=Number(d.qty);d.unit_value=Number(d.unit_value);d.monthly_velocity=Number(d.monthly_velocity);d.role=$('#role')?.value||'Pharmacist';try{await api('/api/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});notify('Shelf record saved');current='Dashboard';await refresh()}catch(e){notify(e.message)}}}async function render(){nav();let html;if(current==='Dashboard')html=Dashboard();if(current==='Inventory')html=Inventory();if(current==='Receive')html=Receive();if(current==='Transfers')html=await Transfers();if(current==='Verification')html=Verification();if(current==='Audit')html=Audit();if(current==='ROI')html=ROI();$('#app').innerHTML=html;bind()}check();refresh();setInterval(check,30000);
</script>
</body></html>
