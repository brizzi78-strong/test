<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ExpiryRx | Expiration Operations</title><style>:root{--n:#07192f;--bg:#f3f7fa;--ink:#11283f;--m:#6d8193;--l:#dce6ed;--r:#be3844;--a:#aa6d08;--g:#08785a;--b:#1769e8;--purple:#6741d9}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#05172b,#0a2947);color:white;padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:26px;font-weight:950;letter-spacing:-.05em}.logo span{font-weight:500;color:#9bc8ef}.tag{font-size:11px;color:#8fa8bd;margin:4px 0 26px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8c8d8;text-align:left;padding:12px;border-radius:10px;font-weight:800}.nav button.on{background:#ffffff12;color:#fff;box-shadow:inset 3px 0 0 #65bbff}.foot{position:absolute;bottom:18px;left:15px;right:15px;border-top:1px solid #ffffff18;padding-top:13px;font-size:10px;color:#8fa8bd;line-height:1.55}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--l);padding:0 25px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:6}.eye{text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:900;color:#73899b}.topt{font-weight:900}.status{font-size:11px;color:var(--m);display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#c89d3b}.dot.live{background:#12a074}.content{max-width:1480px;margin:auto;padding:25px 27px 80px}.demo{background:#fff7e2;border:1px solid #f1d79b;color:#7e5a11;border-radius:11px;padding:9px 12px;font-size:10px;margin-bottom:12px}.hero{background:radial-gradient(circle at 86% 12%,#1e629f 0,#0d3154 27%,#07192f 72%);color:#fff;border-radius:24px;padding:29px;display:grid;grid-template-columns:1.6fr .7fr;gap:26px}.hero h1{font-size:38px;line-height:1.05;letter-spacing:-.05em;margin:7px 0 10px}.hero p{color:#c9d8e5;font-size:14px;line-height:1.55;max-width:780px;margin:0}.heroStat{border-left:1px solid #ffffff24;padding-left:24px;display:flex;flex-direction:column;justify-content:center}.heroStat b{font-size:42px}.heroStat span{font-size:11px;color:#b1c5d7}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:13px}.kpi,.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 15px 42px rgba(7,29,51,.08)}.kpi{padding:15px}.kpi small{display:block;text-transform:uppercase;font-size:8px;letter-spacing:.09em;font-weight:900;color:var(--m)}.kpi b{display:block;font-size:25px;margin-top:7px}.kpi em{display:block;font-style:normal;font-size:9px;color:var(--m);margin-top:3px}.card{padding:18px;margin-top:14px}.cardhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.card h2{margin:0;font-size:18px}.muted{color:var(--m)}.filters{display:grid;grid-template-columns:1.35fr .85fr .85fr .85fr;gap:8px;margin:11px 0}.filters input,.filters select{border:1px solid var(--l);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.list{display:grid;gap:10px}.lot{display:grid;grid-template-columns:minmax(250px,1.45fr) .7fr .8fr 1fr;gap:14px;align-items:center;border:1px solid #e4edf3;border-radius:15px;padding:14px}.lot.imm{border-left:5px solid var(--r)}.lot.pri{border-left:5px solid #d79b2d}.prod{font-size:14px;font-weight:950}.meta{font-size:10px;color:var(--m);margin-top:4px;line-height:1.48}.loc{font-weight:900;color:#1c4b70}.days{font-size:24px;font-weight:950}.days small{display:block;font-size:8px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.red{background:#fff0f1;color:#a63039}.amber{background:#fff5df;color:#956006}.green{background:#e8f7f1;color:#087053}.blue{background:#eaf2ff;color:#155bc5}.purple{background:#f0ebff;color:#5f3dc4}.dist{font-size:11px;font-weight:950}.credit{font-size:16px;font-weight:950}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.btn{border:0;border-radius:9px;padding:8px 9px;font-size:10px;font-weight:900}.primary{background:#0a2948;color:#fff}.ghost{background:#eef3f7;color:#244965}.return{background:#eaf2ff;color:#155bc5}.grid2{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf2f5}.row:last-child{border:0}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf2f5}th{text-transform:uppercase;font-size:8px;letter-spacing:.09em;color:#73899b;background:#f8fafc}.controlGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.controlCard{border:1px solid #e4e0f5;border-radius:14px;padding:14px;background:#fff}.controlCard.alert{border-left:5px solid var(--r)}.controlCard.ok{border-left:5px solid var(--g)}.count{font-size:30px;font-weight:950}.variance{font-size:22px;font-weight:950}.safe{font-weight:900;color:#3f3a67}.toast{position:fixed;right:18px;bottom:18px;background:#07192f;color:white;padding:12px 15px;border-radius:11px;display:none}.mobile{display:none}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side,.top{display:none}.mobile{display:block;background:#07192f;color:white;padding:15px}.content{padding:16px 12px 70px}.hero{grid-template-columns:1fr}.heroStat{border-left:0;border-top:1px solid #ffffff24;padding:16px 0 0}.hero h1{font-size:31px}.kpis,.controlGrid{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:1/-1}.filters,.grid2{grid-template-columns:1fr}.lot{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="logo">ExpiryRx <span>IQ</span></div><div class="tag">Expiration + distributor + controlled inventory</div><nav class="nav" id="nav"></nav><div class="foot">Chain → Store → Shelf → Lot → Distributor → Best Action<br><br>Controlled inventory: expected count → physical count → variance → verification</div></aside><main class="main"><div class="mobile"><div class="logo">ExpiryRx <span>IQ</span></div></div><header class="top"><div><div class="eye">Enterprise Pharmacy Operations</div><div class="topt">Expiration, Returns & Controlled Inventory</div></div><div class="status" id="health"><i class="dot"></i> Connecting</div></header><div class="content" id="app"></div></main></div><div class="toast" id="toast"></div><script>const tabs=['Today','Controlled Substances','Distributor Returns','Transfers','Inventory','ROI'];let current='Today',apiState={stores:[],inventory:[],audit:[],transfers:[]},roi={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const money=n=>'$'+Math.round(Number(n||0)).toLocaleString();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const plus=d=>{let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};const demoLots=[{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Albuterol HFA 90 mcg',lot:'ALB6421',days:18,qty:6,location:'Inhaler Bay B2',value:48,dist:'McKesson',eligible:true,rate:.82,returnBy:plus(10)},{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Latanoprost 0.005% 2.5 mL',lot:'LAT1187',days:27,qty:4,location:'Eye Drop Shelf E1',value:74,dist:'Cardinal Health',eligible:true,rate:.78,returnBy:plus(14)},{chain:'CVS Pharmacy',store:'CVS #7321 — Durham',name:'Amoxicillin 500 mg #30',lot:'AMX9034',days:35,qty:9,location:'Fast Movers A3',value:19,dist:'Cencora',eligible:false,rate:0,returnBy:null},{chain:'Walgreens',store:'Walgreens #10482 — Cary',name:'Atorvastatin 40 mg #90',lot:'ATO7710',days:51,qty:5,location:'Shelf D6',value:36,dist:'Cardinal Health',eligible:true,rate:.86,returnBy:plus(30)},{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Eliquis 5 mg #60',lot:'ELQ551A',days:67,qty:3,location:'Shelf C4',value:520,dist:'McKesson',eligible:true,rate:.90,returnBy:plus(40)},{chain:'CVS Pharmacy',store:'CVS #7321 — Durham',name:'Symbicort 160/4.5',lot:'SYM4412',days:74,qty:3,location:'Inhaler Bay B1',value:215,dist:'Cencora',eligible:true,rate:.84,returnBy:plus(48)},{chain:'Walgreens',store:'Walgreens #10482 — Cary',name:'Adderall XR 20 mg #30',lot:'ADXR280',days:82,qty:2,location:'C-II Safe Drawer 3',value:168,dist:'McKesson',eligible:false,rate:0,returnBy:null},{chain:'CVS Pharmacy',store:'CVS #7321 — Durham',name:'Ondansetron ODT 4 mg #30',lot:'OND3308',days:96,qty:7,location:'Shelf F2',value:28,dist:'Cardinal Health',eligible:true,rate:.75,returnBy:plus(65)},{chain:'Walgreens',store:'Walgreens #10482 — Cary',name:'Mounjaro 10 mg',lot:'MJ7712',days:24,qty:2,location:'Refrigerator 2',value:1050,dist:'Cencora',eligible:true,rate:.88,returnBy:plus(12)},{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Ozempic 2 mg',lot:'OZ24091',days:42,qty:3,location:'Refrigerator 1',value:900,dist:'Cardinal Health',eligible:true,rate:.88,returnBy:plus(22)}];const controlled=[{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Adderall XR 20 mg',schedule:'C-II',ndc:'00078-0615-15',location:'C-II Safe Drawer 2',expected:47,physical:47,last:'Today 8:06 AM',dual:true,lot:'ADX8221',days:110},{chain:'CVS Pharmacy',store:'CVS #7321 — Durham',name:'Adderall 10 mg',schedule:'C-II',ndc:'57844-0110-01',location:'C-II Safe Drawer 1',expected:32,physical:31,last:'Today 7:52 AM',dual:false,lot:'ADD1097',days:84},{chain:'Walgreens',store:'Walgreens #10482 — Cary',name:'Vyvanse 40 mg',schedule:'C-II',ndc:'59417-0104-10',location:'C-II Safe Drawer 4',expected:58,physical:58,last:'Yesterday 6:40 PM',dual:true,lot:'VYV4018',days:132},{chain:'Publix Pharmacy',store:'Publix #1564 — Raleigh',name:'Clonazepam 1 mg',schedule:'C-IV',ndc:'00054-8174-25',location:'Controlled Cabinet B',expected:126,physical:126,last:'Today 8:11 AM',dual:true,lot:'CLN7704',days:192},{chain:'CVS Pharmacy',store:'CVS #7321 — Durham',name:'Alprazolam 0.5 mg',schedule:'C-IV',ndc:'00009-0029-01',location:'Controlled Cabinet A',expected:94,physical:94,last:'Today 8:02 AM',dual:true,lot:'ALP4802',days:160}];const risk=x=>x.days<=30?'IMMEDIATE':x.days<=90?'PRIORITY':'WATCH';const cls=x=>x.days<=30?'imm':x.days<=90?'pri':'';const best=x=>x.eligible&&x.days<=45?'Return to distributor':x.days<=75?'Use first / transfer':'Monitor / transfer';const credit=x=>x.eligible?x.qty*x.value*x.rate:0;function notify(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}async function api(u,o){let r=await fetch(u,o);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{apiState=await api('/api/state');roi=await api('/api/roi');let h=await api('/api/health');$('#health').innerHTML=`<i class="dot live"></i> ${h.db==='postgres'?'Postgres live':'Pilot live'}`}catch(e){}render()}function nav(){const mk=t=>`<button class="${t===current?'on':''}" data-t="${t}">${t}</button>`;$('#nav').innerHTML=tabs.map(mk).join('');$$('[data-t]').forEach(b=>b.onclick=()=>{current=b.dataset.t;render()})}function filters(){return `<div class="filters"><input id="search" placeholder="Search medication, lot, shelf or store"><select id="chain"><option value="">All chains</option><option>Publix Pharmacy</option><option>CVS Pharmacy</option><option>Walgreens</option></select><select id="dist"><option value="">All distributors</option><option>Cardinal Health</option><option>McKesson</option><option>Cencora</option></select><select id="window"><option value="120">≤120 days</option><option value="90">≤90 days</option><option value="60">≤60 days</option><option value="30">≤30 days</option></select></div>`}function lotList(list){return `<div class="list">${list.map(x=>`<div class="lot ${cls(x)}"><div><div class="prod">${esc(x.name)}</div><div class="meta"><b>${esc(x.chain)}</b> · ${esc(x.store)}</div><div class="meta">Lot <b>${x.lot}</b> · Shelf <span class="loc">${esc(x.location)}</span></div></div><div><div class="days">${x.days}<small>days left</small></div><div class="meta">${x.qty} units · ${money(x.qty*x.value)} exposure</div></div><div><div class="dist">${x.dist}</div><div class="meta">${x.eligible?`Return eligible · by ${x.returnBy}`:'Not return eligible'}</div><div class="credit">${x.eligible?money(credit(x)):'—'}</div><div class="meta">estimated credit</div></div><div><span class="pill ${risk(x)==='IMMEDIATE'?'red':risk(x)==='PRIORITY'?'amber':'green'}">${risk(x)}</span><div class="meta"><b>${best(x)}</b></div><div class="actions"><button class="btn primary" onclick="notify('Shelf verification recorded')">Verify</button>${x.eligible?`<button class="btn return" onclick="notify('${x.dist} return started')">Start return</button>`:''}<button class="btn ghost" onclick="notify('Transfer review opened')">Transfer</button></div></div></div>`).join('')}</div>`}function kpis(){let im=demoLots.filter(x=>x.days<=30).length,pr=demoLots.filter(x=>x.days>30&&x.days<=90).length,ret=demoLots.filter(x=>x.eligible).reduce((s,x)=>s+credit(x),0),riskv=demoLots.filter(x=>x.days<=90).reduce((s,x)=>s+x.qty*x.value,0);return `<div class="kpis"><div class="kpi"><small>Immediate lots</small><b>${im}</b><em>≤30 days</em></div><div class="kpi"><small>Priority lots</small><b>${pr}</b><em>31–90 days</em></div><div class="kpi"><small>Chains</small><b>3</b><em>demo tenants</em></div><div class="kpi"><small>Return opportunity</small><b>${money(ret)}</b><em>estimated eligible credit</em></div><div class="kpi"><small>Value at risk</small><b>${money(riskv)}</b><em>≤90 days</em></div></div>`}function Today(){return `<div class="demo"><b>DEMO DATA:</b> Pharmacy and distributor names are sample tenants only; no affiliation or partnership is implied.</div><section class="hero"><div><div class="eye" style="color:#83bde9">Whole-Pharmacy Expiration Intelligence</div><h1>Know the lot.<br>Know the shelf.<br>Know the best exit.</h1><p>ExpiryRx turns expiration risk into a daily worklist and chooses among use-first, store transfer, distributor return, or removal based on lot-level facts.</p></div><div class="heroStat"><b>${demoLots.filter(x=>x.days<=120).length}</b><span>lots requiring attention across the demo network.</span></div></section>${kpis()}<section class="card"><div class="cardhead"><div><h2>Today’s Expiration Worklist</h2><div class="muted">Exact product, lot, shelf, distributor and recommended action.</div></div><span class="pill blue">LIVE DEMO</span></div>${filters()}<div id="lots">${lotList(demoLots)}</div></section>`}function Controlled(){let variances=controlled.filter(x=>x.expected!==x.physical).length,units=controlled.reduce((s,x)=>s+x.physical,0);return `<div class="demo"><b>CONTROLLED-SUBSTANCE DEMO:</b> Operational controls shown here support inventory oversight; they do not by themselves establish DEA or state-law compliance.</div><section class="hero"><div><div class="eye" style="color:#c4b5fd">Controlled Inventory Intelligence</div><h1>Every controlled unit.<br>Every count.<br>Every variance.</h1><p>ExpiryRx adds a perpetual-count workflow for Schedule II–V inventory, with exact safe location, expected-versus-physical count, discrepancy alerts, verification history and dual-check status.</p></div><div class="heroStat"><b>${variances}</b><span>open count variance across ${controlled.length} controlled inventory records.</span></div></section><div class="kpis"><div class="kpi"><small>Controlled records</small><b>${controlled.length}</b><em>Schedule II–V</em></div><div class="kpi"><small>Physical units</small><b>${units}</b><em>demo network</em></div><div class="kpi"><small>Open variances</small><b>${variances}</b><em>requires review</em></div><div class="kpi"><small>Dual verified</small><b>${controlled.filter(x=>x.dual).length}</b><em>latest count event</em></div><div class="kpi"><small>C-II records</small><b>${controlled.filter(x=>x.schedule==='C-II').length}</b><em>separate workflow</em></div></div><section class="card"><div class="cardhead"><div><h2>Controlled Substance Count Queue</h2><div class="muted">Expected count vs. physical count by safe location.</div></div><span class="pill purple">PERPETUAL INVENTORY</span></div><div class="controlGrid">${controlled.map(x=>{let v=x.physical-x.expected;return `<div class="controlCard ${v?'alert':'ok'}"><div class="prod">${x.name}</div><div class="meta"><span class="pill purple">${x.schedule}</span> · ${x.chain}<br>${x.store}</div><div class="meta">Lot ${x.lot} · ${x.days} days to expiry</div><div class="meta safe">${x.location}</div><div class="row"><div><div class="count">${x.expected}</div><div class="meta">expected</div></div><div><div class="count">${x.physical}</div><div class="meta">physical</div></div><div><div class="variance" style="color:${v?'#a63039':'#087053'}">${v>0?'+':''}${v}</div><div class="meta">variance</div></div></div><div class="meta">Last count: ${x.last}<br>${x.dual?'Dual verification recorded':'Second verification required'}</div><div class="actions"><button class="btn primary" onclick="notify('Controlled count verification started')">Verify count</button>${v?`<button class="btn return" onclick="notify('Variance investigation opened')">Investigate variance</button>`:''}<button class="btn ghost" onclick="notify('Audit history opened')">Audit history</button></div></div>`}).join('')}</div></section>`}function Returns(){let list=demoLots.filter(x=>x.eligible).sort((a,b)=>credit(b)-credit(a));return `<div class="demo"><b>DEMO DATA:</b> Cardinal Health, McKesson and Cencora policies/credit rates below are illustrative only.</div><section class="card"><div class="cardhead"><div><h2>Distributor Return Opportunities</h2><div class="muted">Compare distributor return against internal use or transfer.</div></div></div>${lotList(list)}</section>`}function Transfers(){let list=demoLots.filter(x=>!x.eligible||x.days>45);return `<section class="card"><div class="cardhead"><div><h2>Transfer Candidates</h2><div class="muted">Lots where internal redistribution may beat distributor return.</div></div></div>${lotList(list)}</section>`}function Inventory(){return `<section class="card"><h2>Whole-Pharmacy Inventory</h2><div class="table"><table><thead><tr><th>Chain</th><th>Store</th><th>Medication</th><th>Lot</th><th>Location</th><th>Days</th><th>Distributor</th><th>Return</th></tr></thead><tbody>${demoLots.map(x=>`<tr><td>${x.chain}</td><td>${x.store}</td><td><b>${x.name}</b></td><td>${x.lot}</td><td>${x.location}</td><td>${x.days}</td><td>${x.dist}</td><td>${x.eligible?'Eligible':'No'}</td></tr>`).join('')}</tbody></table></div></section>`}function ROI(){let ret=demoLots.filter(x=>x.eligible).reduce((s,x)=>s+credit(x),0);return `${kpis()}<div class="grid2"><section class="card"><h2>Value Recovery Paths</h2><div class="row"><span>Estimated distributor return credit</span><b>${money(ret)}</b></div><div class="row"><span>Inventory protected by actual pilot transfers</span><b>${money(roi.inventory_protected||0)}</b></div><div class="row"><span>Successful pilot transfers</span><b>${roi.successful_transfers||0}</b></div></section><section class="card"><h2>Decision Engine</h2><p class="muted">For every short-dated lot, compare expected value from using it, transferring it, returning it to the distributor, or removing it.</p></section></div>`}function bindFilters(){['search','chain','dist','window'].forEach(id=>{let e=$('#'+id);if(e)e.oninput=()=>{let q=$('#search').value.toLowerCase(),c=$('#chain').value,d=$('#dist').value,w=Number($('#window').value);let f=demoLots.filter(x=>x.days<=w&&(!c||x.chain===c)&&(!d||x.dist===d)&&(!q||[x.name,x.lot,x.location,x.store,x.chain,x.dist].join(' ').toLowerCase().includes(q)));$('#lots').innerHTML=lotList(f)}})}function render(){nav();$('#app').innerHTML=current==='Today'?Today():current==='Controlled Substances'?Controlled():current==='Distributor Returns'?Returns():current==='Transfers'?Transfers():current==='Inventory'?Inventory():ROI();bindFilters()}load();</script></body></html>
