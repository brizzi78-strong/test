<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ExpiryRx Intelligence</title>
<style>
:root{--navy:#07192f;--navy2:#0b2949;--blue:#1768ff;--cyan:#4fb6ff;--ice:#f4f8fb;--white:#fff;--ink:#10243a;--muted:#6f8193;--line:#dce6ee;--red:#d54a52;--amber:#c98b22;--green:#0ca678;--shadow:0 18px 55px rgba(9,31,53,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#edf3f7}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(180deg,#06172b,#0a2340 68%,#0b2949);color:white;padding:22px 16px;position:sticky;top:0;height:100vh}.logo{font-size:25px;font-weight:900;letter-spacing:-.04em}.logo span{font-weight:500;color:#9ecbff}.tag{font-size:11px;color:#8faac3;margin:2px 0 28px;letter-spacing:.03em}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b7c7d7;text-align:left;padding:12px 13px;border-radius:11px;font-weight:760;cursor:pointer}.nav button.on{background:#ffffff12;color:#fff;box-shadow:inset 3px 0 0 #55b8ff}.sidefoot{position:absolute;left:16px;right:16px;bottom:18px;border-top:1px solid #ffffff18;padding-top:14px;font-size:11px;color:#8faac3}.main{min-width:0}.topbar{height:72px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8}.topTitle{font-weight:850}.sys{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#c69a2a;display:inline-block}.dot.live{background:var(--green)}.role{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink)}.content{max-width:1450px;margin:auto;padding:26px 28px 80px}.eyebrow{text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.14em;color:#6d8aa5}.hero{border-radius:24px;overflow:hidden;background:radial-gradient(circle at 85% 15%,#1c66a9 0,#0c3157 26%,#07192f 68%);color:#fff;padding:30px;display:grid;grid-template-columns:1.7fr .8fr;gap:28px;box-shadow:0 25px 70px rgba(6,25,47,.22)}.hero h1{font-size:38px;line-height:1.06;letter-spacing:-.04em;margin:7px 0 10px}.hero p{max-width:760px;color:#c7d7e6;font-size:15px;line-height:1.55;margin:0}.heroValue{border-left:1px solid #ffffff24;padding-left:26px;display:flex;flex-direction:column;justify-content:center}.heroValue .num{font-size:39px;font-weight:900;letter-spacing:-.05em}.heroValue .lab{color:#a9c0d5;font-size:12px;line-height:1.45}.heroChips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{background:#ffffff10;border:1px solid #ffffff1c;border-radius:999px;padding:7px 10px;font-size:11px;color:#dceaf6}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:15px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.metric{padding:17px}.metric small{display:block;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:9px;font-weight:900}.metric b{display:block;font-size:27px;margin-top:8px;letter-spacing:-.035em}.trend{font-size:10px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1.65fr .85fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:19px;margin-top:15px}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:12px}.card h2{font-size:17px;margin:0;letter-spacing:-.02em}.card p{margin:3px 0 0}.muted{color:var(--muted)}.table{overflow:auto;border:1px solid #ebf0f4;border-radius:13px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:12px 11px;border-bottom:1px solid #edf2f5;text-align:left;vertical-align:middle}th{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#7890a4;background:#f8fafc;white-space:nowrap}tr:last-child td{border-bottom:0}.prod{font-weight:800;font-size:12px}.subline{font-size:10px;color:var(--muted);margin-top:2px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;white-space:nowrap}.danger{background:#fff0f1;color:#b93740}.warn{background:#fff6e5;color:#a86d08}.good{background:#e9f8f3;color:#087b5a}.bluepill{background:#eaf2ff;color:#1559c6}.btn{border:0;border-radius:9px;padding:9px 11px;font-size:11px;font-weight:850;cursor:pointer}.primary{background:#0a2745;color:#fff}.secondary{background:#edf3f7;color:#173c5e}.ghost{background:#fff;border:1px solid var(--line);color:#284b68}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf2f5}.row:last-child{border:0}.row b{font-size:12px}.miniIcon{width:35px;height:35px;border-radius:10px;background:#eef5fb;display:grid;place-items:center;font-weight:900;color:#295d89}.flow{display:grid;gap:9px}.flowItem{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid #edf1f4;border-radius:12px;background:#fcfdfe}.flowNum{width:28px;height:28px;border-radius:8px;background:#0b2949;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.sectionTitle{margin-bottom:15px}.sectionTitle h1{margin:0;font-size:28px;letter-spacing:-.035em}.sectionTitle p{margin:5px 0 0;color:var(--muted)}.forms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-weight:900;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink)}input:focus,select:focus{outline:none;border-color:#70a8d7;box-shadow:0 0 0 3px #73ace52c}.full{grid-column:1/-1}.scan{border:1px solid #cee0ee;border-radius:14px;background:linear-gradient(180deg,#f9fcfe,#f1f7fb);padding:17px}.toast{position:fixed;right:20px;bottom:20px;background:#07192f;color:white;padding:13px 16px;border-radius:12px;box-shadow:0 15px 45px #0004;display:none;z-index:20}.savings{font-size:32px;font-weight:900;letter-spacing:-.04em}.mobileHead{display:none}.errorbox{background:#fff0f1;color:#a6323a;padding:14px;border-radius:12px;margin-top:15px;font-size:12px}.loading{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.side{display:none}.mobileHead{display:flex;background:#07192f;color:#fff;padding:16px 18px;justify-content:space-between;align-items:center}.mobileNav{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}.mobileNav button{border:0;border-radius:999px;padding:9px 12px;background:#f1f5f8;color:var(--muted);font-size:11px;font-weight:800}.mobileNav button.on{background:#0a2745;color:#fff}.topbar{display:none}.hero{grid-template-columns:1fr}.heroValue{border-left:0;border-top:1px solid #ffffff24;padding:18px 0 0}.metrics{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.forms{grid-template-columns:1fr}.full{grid-column:auto}.content{padding:18px 14px 70px}.hero h1{font-size:31px}.metrics .metric:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="logo">ExpiryRx <span>Intelligence</span></div><div class="tag">Pharmacy inventory command center</div><nav class="nav" id="nav"></nav><div class="sidefoot">Track · Predict · Redistribute · Prove ROI</div></aside>
<div class="main">
<div class="mobileHead"><div class="logo">ExpiryRx <span>Intelligence</span></div><span id="mhealth"><i class="dot"></i></span></div>
<div class="mobileNav" id="mnav"></div>
<header class="topbar"><div><div class="eyebrow">Enterprise Operations</div><div class="topTitle">Inventory Intelligence Command Center</div></div><div class="sys"><span id="health"><i class="dot"></i> Connecting</span><select class="role" id="role"><option>Pharmacist</option><option>Technician</option><option>Pharmacy Manager</option><option>Corporate Admin</option></select></div></header>
<main class="content" id="app"><div class="loading">Loading ExpiryRx intelligence…</div></main>
</div></div><div class="toast" id="toast"></div>
<script>
const tabs=['Dashboard','Inventory','Receive','Transfers','Verification','Audit','ROI'];let current='Dashboard',state={stores:[],inventory:[],audit:[],transfers:[]},roi={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function store(id){return state.stores.find(s=>s.id===id)?.name||id}function notify(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function pill(r){let c=r==='EXPIRED'||r==='REMOVE/RETURN'?'danger':r==='OK'||r==='WATCH'?'good':'warn';return `<span class="pill ${c}">${esc(r)}</span>`}async function api(url,opt){const r=await fetch(url,opt);let j;try{j=await r.json()}catch(e){throw new Error('Service response error')}if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function refresh(){try{state=await api('/api/state');roi=await api('/api/roi');render()}catch(e){$('#app').innerHTML=`<div class="errorbox"><b>Data service unavailable.</b><br>${esc(e.message)}<br><br>Refresh in a moment.</div>`}}
async function check(){try{const h=await api('/api/health');const txt=h.db==='postgres'?'Postgres live':'Pilot storage live';$('#health').innerHTML=`<i class="dot live"></i> ${txt}`;$('#mhealth').innerHTML='<i class="dot live"></i>'}catch(e){$('#health').textContent='Offline'}}
function nav(){const mk=t=>`<button class="${t===current?'on':''}" data-t="${t}">${t}</button>`;$('#nav').innerHTML=tabs.map(mk).join('');$('#mnav').innerHTML=tabs.map(mk).join('');$$('[data-t]').forEach(b=>b.onclick=()=>{current=b.dataset.t;render()})}
function totals(){let units=state.inventory.reduce((s,x)=>s+Number(x.qty),0),d30=state.inventory.filter(x=>x.days_to_expiry<=30).reduce((s,x)=>s+Number(x.qty),0),d90=state.inventory.filter(x=>x.days_to_expiry>30&&x.days_to_expiry<=90).reduce((s,x)=>s+Number(x.qty),0);return{units,d30,d90,lots:state.inventory.length,risk:roi.inventory_at_risk_90||0}}
function metrics(){let t=totals();let m=[['Units Tracked',t.units,'Across active pilot locations'],['Active Lots',t.lots,'Lot-level visibility'],['≤30 Days',t.d30,'Immediate intervention'],['31–90 Days',t.d90,'Priority exposure'],['Value at Risk',money(t.risk),'Inventory within 90 days']];return `<div class="metrics">${m.map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b><div class="trend">${x[2]}</div></div>`).join('')}</div>`}
function rows(items){return items.map(x=>`<tr><td><div class="prod">${esc(x.name)}</div><div class="subline">${esc(x.gtin||'')}</div></td><td>${esc(x.lot)}</td><td>${esc(store(x.store_id))}</td><td>${esc(x.location||'')}</td><td><b>${x.exp}</b><div class="subline">${x.days_to_expiry} days</div></td><td>${x.qty}</td><td><b>${money(Number(x.qty)*Number(x.unit_value||0))}</b></td><td>${pill(x.risk)} ${x.status==='quarantined'?'<span class="pill danger">QUARANTINED</span>':''}</td><td><button class="btn ghost action" data-id="${x.id}" data-a="dispense">Dispense</button></td></tr>`).join('')}
function Dashboard(){let sorted=[...state.inventory].sort((a,b)=>a.days_to_expiry-b.days_to_expiry).slice(0,7);let urgent=state.inventory.filter(x=>x.days_to_expiry<=90).length;return `<section class="hero"><div><div class="eyebrow" style="color:#83bde9">Network Expiration Intelligence</div><h1>Know what expires.<br>Know where it should go.</h1><p>ExpiryRx turns lot-level expiration data into action—prioritizing risk, matching short-dated inventory to stronger demand, and documenting value protected across the pharmacy network.</p><div class="heroChips"><span class="chip">Lot-level traceability</span><span class="chip">FEFO intelligence</span><span class="chip">Demand-aware redistribution</span><span class="chip">Audit-ready actions</span></div></div><div class="heroValue"><div class="eyebrow" style="color:#83bde9">Protected Inventory</div><div class="num">${money(roi.inventory_protected||0)}</div><div class="lab">Value preserved through approved redistribution activity.</div></div></section>${metrics()}<div class="grid2"><section class="card"><div class="cardhead"><div><h2>Enterprise priority queue</h2><p class="muted">Highest expiration exposure across the network.</p></div><span class="pill ${urgent?'warn':'good'}">${urgent} priority lots</span></div><div class="table"><table><thead><tr><th>Product</th><th>Lot</th><th>Store</th><th>Location</th><th>Expiration</th><th>Qty</th><th>Exposure</th><th>Risk</th><th></th></tr></thead><tbody>${rows(sorted)}</tbody></table></div></section><section class="card"><div class="cardhead"><div><h2>Intelligence engine</h2><p class="muted">From shelf data to network action.</p></div></div><div class="flow"><div class="flowItem"><div class="flowNum">01</div><div><b>Track</b><div class="subline">Lot, expiration, location and value</div></div><span class="pill bluepill">LIVE</span></div><div class="flowItem"><div class="flowNum">02</div><div><b>Prioritize</b><div class="subline">Surface risk before write-off</div></div><span class="pill bluepill">RULES</span></div><div class="flowItem"><div class="flowNum">03</div><div><b>Redistribute</b><div class="subline">Match supply to stronger demand</div></div><span class="pill bluepill">FEFO+</span></div><div class="flowItem"><div class="flowNum">04</div><div><b>Prove ROI</b><div class="subline">Quantify protected inventory</div></div><span class="pill good">MEASURED</span></div></div></section></div><div class="grid3"><section class="card"><div class="eyebrow">Network visibility</div><div class="savings">${state.stores.length}</div><p class="muted">pilot locations connected</p></section><section class="card"><div class="eyebrow">Transfer execution</div><div class="savings">${roi.successful_transfers||0}</div><p class="muted">approved redistribution actions</p></section><section class="card"><div class="eyebrow">Labor signal</div><div class="savings">${roi.estimated_staff_minutes_saved||0}m</div><p class="muted">estimated verification time avoided</p></section></div>`}
function Inventory(){return `<div class="sectionTitle"><div class="eyebrow">Network Inventory</div><h1>Lot-level inventory intelligence</h1><p>See exposure by product, store, expiration, location and value.</p></div>${metrics()}<section class="card"><div class="cardhead"><div><h2>Active inventory</h2><p class="muted">Sorted by expiration urgency.</p></div><span class="pill bluepill">${state.inventory.length} lots</span></div><div class="table"><table><thead><tr><th>Product</th><th>Lot</th><th>Store</th><th>Location</th><th>Expiration</th><th>Qty</th><th>Value</th><th>Risk</th><th></th></tr></thead><tbody>${rows([...state.inventory].sort((a,b)=>a.days_to_expiry-b.days_to_expiry))}</tbody></table></div></section>`}
function Receive(){return `<div class="sectionTitle"><div class="eyebrow">Capture</div><h1>Receive inventory</h1><p>Scanner-ready lot and expiration intake using GS1 data.</p></div><section class="card"><div class="scan"><div class="cardhead"><div><h2>GS1 DataMatrix intake</h2><p class="muted">Scan or paste the product string. ExpiryRx parses GTIN, expiration and lot automatically.</p></div><span class="pill bluepill">SCANNER READY</span></div><div class="forms"><div class="field full"><label>Scan / paste GS1 string</label><input id="scan" placeholder="(01)00301694772127(17)270430(10)LOT123"></div><div><button class="btn secondary" id="parse">Parse scan</button></div></div></div><form id="recv" class="forms" style="margin-top:17px"><div class="field full"><label>Medication</label><input name="name" required></div><div class="field"><label>GTIN / NDC</label><input name="gtin"></div><div class="field"><label>Lot</label><input name="lot" required></div><div class="field"><label>Expiration</label><input type="date" name="exp" required></div><div class="field"><label>Quantity</label><input type="number" min="1" value="1" name="qty" required></div><div class="field"><label>Location</label><input name="location" placeholder="Shelf C4 / Refrigerator 1"></div><div class="field"><label>Unit value ($)</label><input type="number" min="0" step=".01" name="unit_value" value="0"></div><div class="field"><label>Monthly utilization</label><input type="number" min="0" step=".1" name="monthly_velocity" value="0"></div><div class="field full"><label>Store</label><select name="store_id">${state.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><button class="btn primary">Commit inventory record</button></div></form></section>`}
async function Transfers(){let sug=[];try{sug=await api('/api/transfers/suggestions')}catch(e){}return `<div class="sectionTitle"><div class="eyebrow">Network Optimization</div><h1>Redistribution command center</h1><p>Move short-dated inventory toward locations with stronger utilization before value is lost.</p></div><section class="card"><div class="cardhead"><div><h2>Recommended transfers</h2><p class="muted">Prioritized by expiration risk, quantity, value and demand velocity.</p></div><span class="pill bluepill">${sug.length} opportunities</span></div>${sug.length?sug.map(o=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="miniIcon">↗</div><div><b>${esc(o.name)}</b><div>${esc(store(o.from_store))} → ${esc(store(o.to_store))}</div><div class="subline">${o.qty} units · ${o.days} days remaining · demand ${o.source_velocity}/mo → ${o.dest_velocity}/mo</div></div></div><div style="text-align:right"><b>${money(o.protected_value)}</b><div class="subline">protected value</div><button style="margin-top:6px" class="btn primary transfer" data-item="${o.item_id}" data-to="${o.to_store}" data-qty="${o.qty}">Approve transfer</button></div></div>`).join(''):'<p class="muted">No current transfer recommendations.</p>'}</section><section class="card"><div class="cardhead"><div><h2>Transfer history</h2><p class="muted">Executed redistribution activity.</p></div></div>${state.transfers.map(t=>`<div class="row"><div><b>${esc(t.item_name||t.name)}</b><div class="subline">${esc(store(t.from_store))} → ${esc(store(t.to_store))} · ${t.qty} units</div></div><b>${money(t.protected_value)}</b></div>`).join('')||'<p class="muted">No approved transfers yet.</p>'}</section>`}
function Verification(){let list=state.inventory.filter(x=>x.days_to_expiry<=120);return `<div class="sectionTitle"><div class="eyebrow">Exception Workflow</div><h1>Targeted verification</h1><p>Replace full-shelf manual checking with exception-based verification.</p></div><section class="card"><div class="cardhead"><div><h2>Verification queue</h2><p class="muted">Only lots requiring attention within 120 days.</p></div><span class="pill warn">${list.length} exceptions</span></div>${list.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="subline">${esc(store(x.store_id))} · ${esc(x.location)} · lot ${esc(x.lot)} · ${x.days_to_expiry} days</div></div><button class="btn secondary action" data-id="${x.id}" data-a="verify">Verify lot</button></div>`).join('')||'<p class="muted">No verification exceptions.</p>'}</section>`}
function Audit(){return `<div class="sectionTitle"><div class="eyebrow">Governance</div><h1>Audit trail</h1><p>Timestamped operational record of inventory actions.</p></div><section class="card">${state.audit.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div>${esc(a.detail)}</div><div class="subline">${new Date(a.ts).toLocaleString()} · ${esc(a.role||'')}</div></div><span class="pill bluepill">RECORDED</span></div>`).join('')||'<p class="muted">No audit events yet.</p>'}</section>`}
function ROI(){let protectedV=roi.inventory_protected||0,risk=roi.inventory_at_risk_90||0;return `<div class="sectionTitle"><div class="eyebrow">Financial Intelligence</div><h1>ROI command center</h1><p>Pilot metrics show measured operational outputs—not invented savings claims.</p></div><div class="grid3"><section class="card"><div class="eyebrow">Inventory at risk ≤90d</div><div class="savings">${money(risk)}</div><p class="muted">Current expiration exposure requiring intervention.</p></section><section class="card"><div class="eyebrow">Inventory protected</div><div class="savings">${money(protectedV)}</div><p class="muted">Value associated with approved transfers.</p></section><section class="card"><div class="eyebrow">Successful transfers</div><div class="savings">${roi.successful_transfers||0}</div><p class="muted">Executed redistribution events.</p></section></div><section class="card"><div class="cardhead"><div><h2>Enterprise value model</h2><p class="muted">A scaled deployment measures three economic levers.</p></div></div><div class="grid3"><div class="flowItem"><div class="flowNum">01</div><div><b>Avoided write-offs</b><div class="subline">Inventory used or transferred before expiration</div></div></div><div class="flowItem"><div class="flowNum">02</div><div><b>Labor efficiency</b><div class="subline">Fewer manual shelf-wide expiration checks</div></div></div><div class="flowItem"><div class="flowNum">03</div><div><b>Inventory utilization</b><div class="subline">Better placement of product across locations</div></div></div></div></section>`}
function bind(){nav();$$('.action').forEach(b=>b.onclick=async()=>{try{await api('/api/inventory/'+b.dataset.id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.a,role:$('#role')?.value||'Pharmacist'})});notify('Inventory updated');await refresh()}catch(e){notify(e.message)}});$$('.transfer').forEach(b=>b.onclick=async()=>{try{await api('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:b.dataset.item,to_store:b.dataset.to,qty:Number(b.dataset.qty),role:$('#role')?.value||'Pharmacy Manager'})});notify('Transfer approved');await refresh()}catch(e){notify(e.message)}});if($('#parse'))$('#parse').onclick=()=>{let v=$('#scan').value;let g=(v.match(/\(01\)(\d{14})/)||[])[1],e=(v.match(/\(17\)(\d{6})/)||[])[1],l=(v.match(/\(10\)([^()]+)/)||[])[1];let f=$('#recv');if(g)f.gtin.value=g;if(l)f.lot.value=l;if(e){let yy=2000+Number(e.slice(0,2)),mm=e.slice(2,4),dd=e.slice(4,6);f.exp.value=`${yy}-${mm}-${dd}`}notify('Scan parsed')};if($('#recv'))$('#recv').onsubmit=async ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());d.qty=Number(d.qty);d.unit_value=Number(d.unit_value);d.monthly_velocity=Number(d.monthly_velocity);d.role=$('#role')?.value||'Pharmacist';try{await api('/api/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});notify('Inventory received');current='Inventory';await refresh()}catch(e){notify(e.message)}}}
async function render(){nav();let html;if(current==='Dashboard')html=Dashboard();if(current==='Inventory')html=Inventory();if(current==='Receive')html=Receive();if(current==='Transfers')html=await Transfers();if(current==='Verification')html=Verification();if(current==='Audit')html=Audit();if(current==='ROI')html=ROI();$('#app').innerHTML=html;bind()}
check();refresh();setInterval(check,30000);
</script>
