<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpiryRx | Pharmacy Inventory Intelligence</title><style>:root{--navy:#0b1f3a;--navy2:#123a63;--ice:#f4f8fb;--card:#fff;--ink:#15324a;--muted:#6b8093;--line:#dbe5ed;--red:#b43b3b;--amber:#9b6b12;--green:#0b7a62;--shadow:0 16px 44px rgba(11,31,58,.09)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#edf4f8,#f8fbfd);color:var(--ink)}button,input,select{font:inherit}.top{background:linear-gradient(135deg,var(--navy),#0f3358);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900;font-size:24px}.brand span{opacity:.72;font-weight:600}.sub{font-size:12px;opacity:.72}.role{display:flex;gap:10px;align-items:center}.role select{border:1px solid #ffffff33;border-radius:999px;background:#ffffff14;color:#fff;padding:9px 13px}.role option{color:#111}.nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#f7fbfd;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav button{border:0;border-radius:999px;padding:10px 14px;background:#fff;color:var(--muted);font-weight:800;cursor:pointer}.nav button.on{background:var(--navy);color:#fff}.wrap{max-width:1260px;margin:auto;padding:20px 14px 80px}.hero{border-radius:24px;background:linear-gradient(135deg,#102f52,#0b1f3a);color:#fff;padding:26px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px}.hero h1{margin:4px 0 8px;font-size:32px}.hero p{margin:0;opacity:.83;max-width:720px}.hero .big{font-size:34px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.metric{padding:16px}.metric small{font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:7px}.card{padding:18px;margin-top:14px}.card h2{margin:0 0 4px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf2f6;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#f8fbfd}.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#edf3f7}.danger{background:#fdeaea;color:var(--red)}.warn{background:#fff1d7;color:var(--amber)}.good{background:#e9f6f2;color:var(--green)}.btn{border:0;border-radius:999px;padding:10px 13px;font-weight:850;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eaf1f7;color:var(--navy)}.redbtn{background:#fdeaea;color:var(--red)}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #edf2f6}.row:last-child{border:0}.forms{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:850;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.full{grid-column:1/-1}.scan{background:#f4f8fb;border:1px dashed #aac0d2;padding:14px;border-radius:16px}.toast{position:fixed;right:16px;bottom:16px;background:#0b1f3a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);display:none}.statusdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#c89a28;margin-right:6px}.statusdot.live{background:#1a9b70}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid2,.forms{grid-template-columns:1fr}.full{grid-column:auto}.hero{display:block}.hero>div:last-child{margin-top:18px}.top{align-items:flex-start;flex-direction:column}.metrics .metric:last-child{grid-column:1/-1}}</style></head><body><header class="top"><div><div class="brand">ExpiryRx <span>Intelligence</span></div><div class="sub">Track. Predict. Redistribute. Prove the ROI.</div></div><div class="role"><span id="health"><i class="statusdot"></i>Connecting</span><select id="role"><option>Pharmacist</option><option>Technician</option><option>Pharmacy Manager</option><option>Corporate Admin</option></select></div></header><nav class="nav" id="nav"></nav><main class="wrap" id="app"></main><div class="toast" id="toast"></div><script>const tabs=['Dashboard','Inventory','Receive','Transfers','Verification','Audit','ROI'];let current='Dashboard',state={stores:[],inventory:[],audit:[],transfers:[]},roi={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function store(id){return state.stores.find(s=>s.id===id)?.name||id}function notify(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function pill(r){let c=r==='EXPIRED'||r==='REMOVE/RETURN'?'danger':r==='OK'||r==='WATCH'?'good':'warn';return `<span class="pill ${c}">${esc(r)}</span>`}async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}async function refresh(){state=await api('/api/state');roi=await api('/api/roi');render()}async function check(){try{const h=await api('/api/health');$('#health').innerHTML=`<i class="statusdot live"></i>${h.db==='postgres'?'Postgres':'Pilot storage'} live`}catch(e){$('#health').textContent='Offline'}}function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${t===current?'on':''}" data-t="${t}">${t}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>{current=b.dataset.t;render()})}function totals(){let units=state.inventory.reduce((s,x)=>s+Number(x.qty),0),d30=state.inventory.filter(x=>x.days_to_expiry<=30).reduce((s,x)=>s+Number(x.qty),0),d90=state.inventory.filter(x=>x.days_to_expiry>30&&x.days_to_expiry<=90).reduce((s,x)=>s+Number(x.qty),0);return{units,d30,d90,lots:state.inventory.length,risk:roi.inventory_at_risk_90||0}}function metrics(){let t=totals();return `<div class="metrics">${[['Units Tracked',t.units],['Lots',t.lots],['≤30 Days',t.d30],['31–90 Days',t.d90],['Value at Risk',money(t.risk)]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`}function rows(items){return items.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.gtin||'')}</span></td><td>${esc(x.lot)}</td><td>${esc(store(x.store_id))}</td><td>${esc(x.location||'')}</td><td>${x.exp}<br><span class="muted">${x.days_to_expiry} days</span></td><td>${x.qty}</td><td>${money(Number(x.qty)*Number(x.unit_value||0))}</td><td>${pill(x.risk)} ${x.status==='quarantined'?'<span class="pill danger">QUARANTINED</span>':''}</td><td><button class="btn secondary action" data-id="${x.id}" data-a="dispense">Dispense 1</button></td></tr>`).join('')}function Dashboard(){let sorted=[...state.inventory].sort((a,b)=>a.days_to_expiry-b.days_to_expiry).slice(0,6);return `<section class="hero"><div><div class="muted" style="color:#b8c8d8;font-weight:900;text-transform:uppercase;letter-spacing:.09em;font-size:11px">Pharmacy Inventory Intelligence</div><h1>Know what expires. Know where it should go.</h1><p>ExpiryRx combines lot-level expiration tracking with inventory redistribution so pharmacies can act before short-dated medication becomes a loss.</p></div><div><div class="big">${money(roi.inventory_protected||0)}</div><div>inventory protected by approved transfers</div></div></section>${metrics()}<div class="grid2"><section class="card"><h2>Priority queue</h2><p class="muted">Most urgent expiration exposure first.</p><div class="table"><table><thead><tr><th>Product</th><th>Lot</th><th>Store</th><th>Location</th><th>Expires</th><th>Qty</th><th>Value</th><th>Action</th><th></th></tr></thead><tbody>${rows(sorted)}</tbody></table></div></section><section class="card"><h2>What makes ExpiryRx different</h2><div class="row"><div><b>Track</b><div class="muted">Lot + expiration + location</div></div></div><div class="row"><div><b>Predict</b><div class="muted">Which inventory is likely to expire</div></div></div><div class="row"><div><b>Redistribute</b><div class="muted">Move short-dated stock toward stronger demand</div></div></div><div class="row"><div><b>Prove ROI</b><div class="muted">Protected inventory, transfers and labor indicators</div></div></div></section></div>`}function Inventory(){return `<div><h1>Inventory</h1><p class="muted">Live lot-level pilot inventory.</p></div>${metrics()}<section class="card"><div class="table"><table><thead><tr><th>Product</th><th>Lot</th><th>Store</th><th>Location</th><th>Expires</th><th>Qty</th><th>Value</th><th>Action</th><th></th></tr></thead><tbody>${rows(state.inventory)}</tbody></table></div></section>`}function Receive(){return `<h1>Receive inventory</h1><p class="muted">Scanner-ready intake. A USB/Bluetooth scanner can type the GS1 string into the field below.</p><section class="card"><div class="scan"><b>GS1 scan parser</b><div class="forms" style="margin-top:10px"><div class="field full"><label>Scan / paste GS1 string</label><input id="scan" placeholder="(01)00301694772127(17)270430(10)LOT123(21)SERIAL9"></div><div><button class="btn secondary" id="parse">Parse scan</button></div></div></div><form id="recv" class="forms" style="margin-top:16px"><div class="field full"><label>Medication</label><input name="name" required></div><div class="field"><label>GTIN / NDC</label><input name="gtin"></div><div class="field"><label>Lot</label><input name="lot" required></div><div class="field"><label>Expiration</label><input type="date" name="exp" required></div><div class="field"><label>Quantity</label><input type="number" min="1" value="1" name="qty" required></div><div class="field"><label>Location</label><input name="location" placeholder="Shelf C4 / Refrigerator 1"></div><div class="field"><label>Unit value ($)</label><input type="number" min="0" step=".01" name="unit_value" value="0"></div><div class="field"><label>Monthly utilization</label><input type="number" min="0" step=".1" name="monthly_velocity" value="0"></div><div class="field full"><label>Store</label><select name="store_id">${state.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><button class="btn primary">Save received inventory</button></div></form></section>`}async function Transfers(){let sug=[];try{sug=await api('/api/transfers/suggestions')}catch(e){}return `<h1>Transfer intelligence</h1><p class="muted">Expiration risk + location demand = redistribution opportunities.</p><section class="card"><h2>Recommended transfers</h2>${sug.length?sug.map(o=>`<div class="row"><div><b>${esc(o.name)}</b><div>${esc(store(o.from_store))} → ${esc(store(o.to_store))}</div><div class="muted">${o.qty} units • ${o.days} days left • velocity ${o.source_velocity}/mo → ${o.dest_velocity}/mo</div></div><div><b>${money(o.protected_value)}</b><br><button class="btn primary transfer" data-item="${o.item_id}" data-to="${o.to_store}" data-qty="${o.qty}">Approve</button></div></div>`).join(''):'<p class="muted">No current transfer recommendations.</p>'}</section><section class="card"><h2>Transfer history</h2>${state.transfers.map(t=>`<div class="row"><div><b>${esc(t.item_name||t.name)}</b><div class="muted">${esc(store(t.from_store))} → ${esc(store(t.to_store))} • ${t.qty} units</div></div><b>${money(t.protected_value)}</b></div>`).join('')||'<p class="muted">No approved transfers yet.</p>'}</section>`}function Verification(){let list=state.inventory.filter(x=>x.days_to_expiry<=120);return `<h1>Monthly verification</h1><p class="muted">Exception-based shelf check instead of checking every item.</p><section class="card"><h2>${list.length} lots need attention</h2>${list.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(store(x.store_id))} • ${esc(x.location)} • lot ${esc(x.lot)} • ${x.days_to_expiry} days</div></div><button class="btn secondary action" data-id="${x.id}" data-a="verify">Verify</button></div>`).join('')}</section>`}function Audit(){return `<h1>Audit trail</h1><p class="muted">Actions are timestamped with role and store context.</p><section class="card">${state.audit.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div>${esc(a.detail)}</div><div class="muted">${new Date(a.ts).toLocaleString()} • ${esc(a.role||'')}</div></div></div>`).join('')||'<p class="muted">No audit events yet.</p>'}</section>`}function ROI(){return `<h1>ROI dashboard</h1><p class="muted">Pilot metrics are measurement outputs, not invented savings claims.</p><div class="metrics"><div class="metric"><small>Inventory at risk ≤90d</small><b>${money(roi.inventory_at_risk_90)}</b></div><div class="metric"><small>Inventory protected</small><b>${money(roi.inventory_protected)}</b></div><div class="metric"><small>Successful transfers</small><b>${roi.successful_transfers||0}</b></div><div class="metric"><small>Est. staff minutes saved</small><b>${roi.estimated_staff_minutes_saved||0}</b></div><div class="metric"><small>Core thesis</small><b style="font-size:18px">Avoid waste + reduce labor</b></div></div><section class="card"><h2>ROI equation</h2><p><b>Annual ExpiryRx Value = Avoided Expiration Loss + Labor Savings + Inventory Redistribution Savings</b></p><p class="muted">The pilot should establish a baseline and measure actual improvement before any enterprise savings percentage is claimed.</p></section>`}async function render(){nav();let html;if(current==='Transfers')html=await Transfers();else html=({Dashboard,Inventory,Receive,Verification,Audit,ROI}[current]||Dashboard)();$('#app').innerHTML=html;bind()}function bind(){$$('.action').forEach(b=>b.onclick=async()=>{await api('/api/inventory/'+b.dataset.id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.a,role:$('#role').value})});notify('Action saved');await refresh()});if($('#parse'))$('#parse').onclick=()=>{let s=$('#scan').value,f=$('#recv'),m;s=s.trim();m=s.match(/\(01\)(\d{14})/);if(m)f.gtin.value=m[1];m=s.match(/\(17\)(\d{6})/);if(m){let v=m[1];f.exp.value='20'+v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4,6)}m=s.match(/\(10\)([^()]+)/);if(m)f.lot.value=m[1];notify('Barcode data parsed')};if($('#recv'))$('#recv').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),o=Object.fromEntries(fd.entries());o.qty=Number(o.qty);o.unit_value=Number(o.unit_value);o.monthly_velocity=Number(o.monthly_velocity);o.role=$('#role').value;await api('/api/inventory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});notify('Inventory received');current='Inventory';await refresh()};$$('.transfer').forEach(b=>b.onclick=async()=>{await api('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:b.dataset.item,to_store:b.dataset.to,qty:Number(b.dataset.qty),role:$('#role').value})});notify('Transfer approved');await refresh()})}check();refresh();</script></body></html>
