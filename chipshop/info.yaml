# Tiny Tapeout project metadata. See https://tinytapeout.com for the
# current template — field names occasionally change between shuttles,
# so re-check against the template repo before submitting.
project:
  title: "CARD-1 hex counter"
  author: "Rob Brizzi"
  discord: ""
  description: "Hex counter on a 7-segment display with speed/pause controls and a breathing-LED PWM output"
  language: "Verilog"
  clock_hz: 10000000

  # How many tiles the design occupies. CARD-1 is tiny; 1x1 is plenty.
  tiles: "1x1"

  top_module: "tt_um_brizzi_card1"
  source_files:
    - "tt_um_brizzi_card1.v"

pinout:
  ui[0]: "speed select bit 0"
  ui[1]: "speed select bit 1"
  ui[2]: "pause"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "segment a"
  uo[1]: "segment b"
  uo[2]: "segment c"
  uo[3]: "segment d"
  uo[4]: "segment e"
  uo[5]: "segment f"
  uo[6]: "segment g"
  uo[7]: "PWM breathing LED"
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
