# Render blueprint (FREE tier) — the Blue Ridge Press verify portal at $0/mo.
#
# ONE-CLICK: every value below is set or auto-generated — there is nothing to
# type during setup and no post-deploy env editing.
#
#   1. https://render.com  ->  New +  ->  Blueprint  ->  connect this GitHub
#      repo  ->  pick this file (deploy/render-verify-free.yaml)  ->  Apply.
#   2. That's it. Render builds the image and serves
#      https://cardinal-verify-*.onrender.com — the app reads its own public
#      URL from RENDER_EXTERNAL_URL, so consent links, verify links, and the
#      QR codes on PDF reports are correct on the first boot.
#
# The console login is admin / <generated password> — read the password under
# the service's Environment tab (VERIFY_PASSWORD). Change it there any time.
#
# TRADE-OFFS of the free tier (fine for demos and your first pilots):
#   * Spins down after ~15 min idle; the next visit takes ~30-60s to wake.
#   * Storage is EPHEMERAL: the SQLite file is wiped on restart/redeploy, so
#     consent records do not survive. Before charging real clients, switch to
#     deploy/render-verify.yaml (adds a persistent disk, ~$7/mo) — same app,
#     nothing else changes.
#
# Optional email sending (otherwise links are shown in the console to copy):
# set SENDGRID_API_KEY + VERIFY_MAIL_FROM in the Environment tab.
#
# HTTPS is automatic. Full runbook: deploy/DEPLOY-VERIFY.md

services:
  - type: web
    name: cardinal-verify
    runtime: docker
    branch: claude/background-check-services-rss0ky # switch to main once PR #68 merges
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node verify/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VERIFY_DB
        value: /tmp/verify.db # ephemeral on the free plan — see trade-offs above
      - key: VERIFY_USER
        value: admin
      - key: VERIFY_PASSWORD
        generateValue: true # strong password minted on first deploy; read it in the Environment tab
      - key: VERIFY_CERT_SECRET
        generateValue: true # keys tracking numbers, verification codes, and integrity seals — never change it after reports exist
