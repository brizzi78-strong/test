# Render blueprint (PRODUCTION) — the Blue Ridge Press verify portal with a
# persistent disk, so consent records and reports survive restarts. ~$7/mo.
#
# ONE-CLICK: every value below is set or auto-generated — nothing to type
# during setup and no post-deploy env editing.
#
#   1. https://render.com  ->  New +  ->  Blueprint  ->  connect this GitHub
#      repo  ->  pick this file (deploy/render-verify.yaml)  ->  Apply.
#   2. That's it. Render builds the image, attaches a 1 GB disk, and serves
#      https://cardinal-verify-*.onrender.com — the app reads its own public
#      URL from RENDER_EXTERNAL_URL, so consent links, verify links, and the
#      QR codes on PDF reports are correct on the first boot.
#
# The console login is admin / <generated password> — read the password under
# the service's Environment tab (VERIFY_PASSWORD). Change it there any time.
#
# Custom domain (recommended before marketing):
#   Settings -> Custom Domains -> add verify.blueridgepressllc.com, then create
#   the DNS CNAME Render shows you. Set VERIFY_BASE_URL to
#   https://verify.blueridgepressllc.com in the Environment tab so emailed
#   links and report QR codes carry your brand, not onrender.com.
#
# Email sending (recommended): set SENDGRID_API_KEY + VERIFY_MAIL_FROM in the
# Environment tab; until then, links are shown in the console to copy.
#
# HTTPS is automatic. Full runbook: deploy/DEPLOY-VERIFY.md

services:
  - type: web
    name: cardinal-verify
    runtime: docker
    branch: claude/background-check-services-rss0ky # switch to main once PR #68 merges
    plan: starter # a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node verify/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: verify-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VERIFY_DB
        value: /data/verify.db
      - key: VERIFY_USER
        value: admin
      - key: VERIFY_PASSWORD
        generateValue: true # strong password minted on first deploy; read it in the Environment tab
      - key: VERIFY_CERT_SECRET
        generateValue: true # keys tracking numbers, verification codes, and integrity seals — never change it after reports exist
