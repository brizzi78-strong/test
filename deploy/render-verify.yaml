# Render blueprint — deploy the Cardinal Verify portal with no server to manage.
#
# Verify is the consent-first background-check portal: an employer console, the
# candidate's e-sign/consent page, and a per-source verifier page — all in one
# zero-dependency Node service backed by a durable SQLite file.
#
# One-time setup at https://render.com :
#   1. New +  ->  Blueprint  ->  connect this GitHub repo  ->  pick this file
#      (render-verify.yaml)  ->  Apply.
#   2. When prompted, set VERIFY_PASSWORD to a strong password (VERIFY_USER is
#      "admin" by default). This gates the employer console; the candidate
#      consent and verifier links stay public (they have no login).
#   3. Render builds the Docker image, attaches a 1 GB disk for the data, and
#      gives you an https://cardinal-verify-*.onrender.com URL.
#   4. Copy that URL into VERIFY_BASE_URL (edit the env var and redeploy) so the
#      emailed consent/verifier links point at the right host. Later, to use a
#      custom domain like verify.blueridgepressllc.com, add it under Settings ->
#      Custom Domains, point a DNS CNAME at Render, and update VERIFY_BASE_URL.
#   5. (Optional, to actually send email) set SENDGRID_API_KEY + VERIFY_MAIL_FROM,
#      or the SMTP_* vars — otherwise links are shown in the console to copy.
#
# HTTPS is automatic. Data persists on the disk across deploys and restarts.
#
# NOTE: `branch` is set to main — merge PR #65 first so main contains verify/.
# To deploy before merging, change `branch` to
# claude/background-check-services-rss0ky.

services:
  - type: web
    name: cardinal-verify
    runtime: docker
    branch: main
    plan: starter            # ~$7/mo; a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node verify/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: verify-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VERIFY_DB
        value: /data/verify.db
      - key: VERIFY_USER
        value: admin
      - key: VERIFY_PASSWORD
        sync: false            # Render prompts you to set this on first deploy
      - key: VERIFY_BASE_URL
        sync: false            # set to your Render URL (or custom domain) after first deploy
      # Optional email delivery — leave unset to copy links from the console:
      - key: SENDGRID_API_KEY
        sync: false
      - key: VERIFY_MAIL_FROM
        sync: false
