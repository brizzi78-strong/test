name: deploy-cp17-aws

# Publishes cp17-site to S3 + CloudFront. Authenticates with a short-lived
# OIDC token assumed from the role the CloudFormation stack creates — no AWS
# access keys are stored in GitHub. Stays dormant until the AWS_DEPLOY_ROLE
# repository variable is set, so it is safe to merge before AWS exists.
on:
  push:
    branches: [main]
    paths:
      - "cp17-site/**"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy
  cancel-in-progress: true

jobs:
  publish:
    name: Publish cp17-site to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether AWS is configured yet
        id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE is not set — skipping. GitHub Pages still serves the site."
          fi

      - name: Assume the deploy role
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: Sync the site to S3
        if: steps.check.outputs.ready == 'true'
        run: |
          # Long cache for fingerprint-free assets is unsafe here (filenames
          # never change), so assets get a short TTL and HTML is never cached
          # by the browser — CloudFront still caches both at the edge.
          aws s3 sync cp17-site "s3://${{ vars.AWS_SITE_BUCKET }}" \
            --delete \
            --exclude "README.md" \
            --exclude "CNAME" \
            --cache-control "public,max-age=300"

          aws s3 cp "s3://${{ vars.AWS_SITE_BUCKET }}" "s3://${{ vars.AWS_SITE_BUCKET }}" \
            --recursive --exclude "*" --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate the CloudFront cache
        if: steps.check.outputs.ready == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*"
