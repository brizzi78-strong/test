name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/cardinal-dating-site-433v0f]
    paths:
      - "social/demo/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish demo to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp social/demo/cardinal-demo.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish The Cardinal demo"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
