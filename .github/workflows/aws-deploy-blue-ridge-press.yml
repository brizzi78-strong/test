name: deploy-blue-ridge-press-aws

# Publishes site/ (the Blue Ridge Press homepage) to S3 + CloudFront. Same
# pattern as deploy-cardinal-care-bridge-aws: a short-lived OIDC token, no AWS
# access keys stored in GitHub. Stays dormant until AWS_DEPLOY_ROLE_BLUE_RIDGE_PRESS
# is set, so it is safe to merge before AWS exists — see deploy/aws/README.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/aws-deploy-blue-ridge-press.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy-blue-ridge-press
  cancel-in-progress: true

jobs:
  publish:
    name: Publish site/ to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether AWS is configured yet
        id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_BLUE_RIDGE_PRESS }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_BLUE_RIDGE_PRESS is not set — skipping. Render still serves this site."
          fi

      - name: Assume the deploy role
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_BLUE_RIDGE_PRESS }}
          aws-region: us-east-1

      - name: Sync the site to S3
        if: steps.check.outputs.ready == 'true'
        run: |
          aws s3 sync site "s3://${{ vars.AWS_SITE_BUCKET_BLUE_RIDGE_PRESS }}" \
            --delete \
            --cache-control "public,max-age=300"

          aws s3 cp "s3://${{ vars.AWS_SITE_BUCKET_BLUE_RIDGE_PRESS }}" "s3://${{ vars.AWS_SITE_BUCKET_BLUE_RIDGE_PRESS }}" \
            --recursive --exclude "*" --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate the CloudFront cache
        if: steps.check.outputs.ready == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID_BLUE_RIDGE_PRESS }}" \
            --paths "/*"
