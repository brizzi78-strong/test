# Render blueprint for The Cardinal social app.
# A persistent disk keeps member signups/posts across restarts and deploys.
services:
  - type: web
    name: cardinal-social
    runtime: node
    rootDir: social
    plan: starter
    buildCommand: ""
    startCommand: node server.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEST_DB
        value: /data/nest.db
      # Render will prompt you for these when you deploy the blueprint,
      # so your founder login is private (not the public repo default).
      - key: SEED_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false
    disk:
      name: cardinal-data
      mountPath: /data
      sizeGB: 1
