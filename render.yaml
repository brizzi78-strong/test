# Render blueprint — deploy this repo's services with no server to manage.
#
# One-time setup at https://render.com :
#   1. New +  ->  Blueprint  ->  connect this GitHub repo  ->  Apply.
#   2. Render provisions every service below in one pass. For Cardinal Books,
#      when prompted, set BOOKS_PASSWORD to a strong password (BOOKS_USER is
#      "admin" by default; change it here if you like).
#   3. Each service gets its own https://<name>-*.onrender.com URL.
#   4. (Optional) Add a custom domain per service in Settings -> Custom Domains,
#      then point a DNS CNAME at Render.
#
# HTTPS is automatic on every service. Cardinal Books (BOOKS_USER /
# BOOKS_PASSWORD) and Blue Ridge Tax (TAXFILE_USER / TAXFILE_PASSWORD) are
# password-gated and persist data on disks across deploys and restarts;
# Cardinal Care Bridge is a public static site with no login.

services:
  - type: web
    name: cardinal-books
    runtime: docker
    branch: main             # deploy from main (this work is merged there)
    plan: starter            # ~$7/mo; a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node deploy/allinone.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: books-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BUSINESS_NAME
        value: Blue Ridge Press LLC
      - key: ACCOUNTING_DB
        value: /data/accounting.db
      - key: BOOKS_USER
        value: admin
      - key: BOOKS_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Cardinal Care Bridge — the placement-business landing page (cardinal-care-bridge/).
  # A static site: no build step, no server, no disk, and free on Render (no `plan`
  # needed). Same one-time setup as above (Blueprint -> connect repo -> Apply) gives
  # you an https://cardinal-care-bridge-*.onrender.com URL; add a custom domain like
  # www.cardinalcarebridge.com the same way, in Settings -> Custom Domains.
  #
  # Before pointing real traffic at it: replace the placeholder email
  # (hello@cardinalcarebridge.example) and phone number in cardinal-care-bridge/index.html
  # with real contact details — see that folder's README for the full launch checklist.
  - type: web
    name: cardinal-care-bridge
    runtime: static
    branch: main
    staticPublishPath: ./cardinal-care-bridge
    autoDeploy: true

  # Cardinal Expenses — the landing page for the expense app (cardinal-expenses/).
  # Static, like the care-bridge site: no build step, no server, no disk, free on
  # Render. Before pointing real traffic at it, swap the hero's "Run it yourself"
  # button for the URL of the cardinal-expenses-app service below — see that
  # folder's README.
  #
  # Served at expenses.thecardinalspromise.com — a subdomain, deliberately, so
  # the apex keeps serving the book. To put this on the apex instead, replace
  # the domain below with thecardinalspromise.com and www.thecardinalspromise.com
  # and give Render the A record it asks for rather than the CNAME.
  - type: web
    name: cardinal-expenses
    runtime: static
    branch: main
    staticPublishPath: ./cardinal-expenses
    autoDeploy: true
    domains:
      - expenses.thecardinalspromise.com

  # Cardinal Expenses (app) — the expense reporting service (expenses/): policy
  # checks at entry time, auto-approval of compliant reports, corporate card
  # feed, Mint-style budgets, and an approver queue. Password-gated
  # (EXPENSES_USER / EXPENSES_PASSWORD — set the password when Render prompts;
  # reports carry receipt images and card data, so do not run this ungated).
  # Reports, budgets and the card feed persist in SQLite on the mounted disk.
  - type: web
    name: cardinal-expenses-app
    runtime: docker
    branch: main
    plan: starter            # a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node expenses/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: expenses-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRAND_NAME
        value: Cardinal Expenses
      - key: EXPENSES_DB
        value: /data/expenses.db
      - key: EXPENSES_USER
        value: admin
      - key: EXPENSES_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Cardinal Coverage — SNF Medicare Advantage management. Deployed as TWO
  # services on purpose.
  #
  # 1) The buyer-facing marketing page is a public static site (site/). Free on
  #    Render, no build step, no server.
  # 2) Everything else — the four working tools plus the investor deck and
  #    one-pager — sits behind HTTP Basic auth (app/, served by
  #    cardinal-coverage/deploy/server.mjs). It is gated because the tools are
  #    where resident data gets typed and there is no BAA behind them, and
  #    because the investor materials still contain FILL IN blocks that must not
  #    be indexed. Every gated page also carries a noindex meta and the server
  #    sends X-Robots-Tag: noindex.
  #
  # Set CC_PASSWORD when Render prompts on first deploy (CC_USER defaults to
  # "cardinal"). The service refuses to start without a password rather than
  # coming up ungated.
  - type: web
    name: cardinal-coverage
    runtime: static
    branch: main
    staticPublishPath: ./cardinal-coverage/site
    autoDeploy: true

  - type: web
    name: cardinal-coverage-app
    runtime: docker
    branch: main
    plan: starter
    dockerfilePath: ./cardinal-coverage/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CC_USER
        value: cardinal
      - key: CC_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Memory Care Music Program — public program entrypoint backed by a
  # dependency-free Node server. The interactive walkthrough uses sample
  # residents only and stores nothing; the production shell supplies public
  # metadata, stable routes, security headers, and a health endpoint.
  - type: web
    name: memory-care-music-program
    runtime: node
    branch: main
    plan: free
    buildCommand: node --version
    startCommand: node singalong/publish-server.mjs
    healthCheckPath: /health
    autoDeploy: true

  # Blue Ridge Tax — the TaxFile app (taxfile/): guided federal tax estimator
  # (2025 + 2026 projection) with a live refund tracker, scope screening, user
  # accounts, and a Stripe-ready Pro tier (planning scenarios). No SSNs are
  # collected. Data persists in SQLite on the mounted disk.
  #
  # Served at tax.blueridgellc.com — a subdomain, deliberately, so whatever
  # blueridgellc.com serves today keeps serving it. To put the estimator on the
  # apex instead, replace the domain below with blueridgellc.com and
  # www.blueridgellc.com, update PUBLIC_BASE_URL to match, and give Render the
  # A record it asks for rather than the CNAME.
  #
  # DNS, once: at your registrar add a CNAME for "tax" pointing at the
  # blue-ridge-tax service's onrender.com hostname (Render shows it under
  # Settings -> Custom Domains). HTTPS is issued automatically once the record
  # resolves.
  #
  # Password gate: TAXFILE_USER / TAXFILE_PASSWORD are set below, so the app
  # ships gated. Going public per the launch plan means REMOVING both from the
  # service's environment — the app collects no SSNs or addresses, and /health,
  # /terms and /privacy stay reachable either way.
  #
  # To enable real billing, add STRIPE_SECRET_KEY, STRIPE_PRICE_ID, and
  # STRIPE_WEBHOOK_SECRET in the service's environment; until then upgrades
  # run in instant dev mode.
  - type: web
    name: blue-ridge-tax
    runtime: docker
    branch: main
    plan: starter            # a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node taxfile/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - tax.blueridgellc.com
    disk:
      name: tax-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRAND_NAME
        value: Blue Ridge Tax
      - key: TAXFILE_DB
        value: /data/taxfile.db
      - key: PUBLIC_BASE_URL
        value: https://tax.blueridgellc.com
      # Legal pages at /terms and /privacy name the operator. Both are
      # prompted rather than committed: the entity must be the exact
      # registered name, and the address must be a mailbox someone actually
      # reads — people exercise deletion rights there.
      - key: LEGAL_ENTITY
        sync: false            # e.g. "Blue Ridge Press LLC"
      - key: LEGAL_EMAIL
        sync: false            # a monitored address, e.g. hello@blueridgellc.com
      - key: LEGAL_STATE
        value: North Carolina
      - key: TAXFILE_USER
        value: admin
      - key: TAXFILE_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Cardinal Trading — the trading app (invest/ over trading/): multi-user
  # accounts with paper buying power, real market quotes (Yahoo), fractional
  # and recurring buys, and the CARD token page. Sign-ups are open; every user
  # gets their own login and an isolated paper account, so no shared gate is
  # needed. Data persists in SQLite on the mounted disk.
  #
  # CARD launch day: only after the verified address is published at cp17.org,
  # add ETH_RPC_URL, CARD_POOL_ADDRESS, and CARD_TOKEN_ADDRESS. Set
  # ENABLE_REAL_CARD_LINKS=1 separately to expose links that open Uniswap.
  # For real verification/reset emails, add SENDGRID_API_KEY,
  # INVEST_MAIL_FROM, and INVEST_BASE_URL (the service's public URL);
  # until then the links print to the service logs.
  # To serve this at a cp17.org address, add the subdomain (e.g.
  # trade.cp17.org) in Settings -> Custom Domains and point a DNS CNAME at it.
  - type: web
    name: cardinal-trading
    runtime: docker
    branch: main
    plan: starter            # a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node deploy/allinone-trading.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: trading-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TRADING_DB
        value: /data/trading.db
      - key: INVEST_DB
        value: /data/invest.db
      - key: MARKET_DATA
        value: yahoo           # live quotes; remove to fall back to the mock feed
      - key: INVEST_TRUST_PROXY
        value: "1"             # Render terminates TLS; trust its proxy for Secure cookies
      - key: ENABLE_REAL_CARD_LINKS
        value: "0"             # address alone cannot expose real-money links

  # Cardinal Chat — self-hosted ChatGPT alternative (chat/), powered by the
  # Claude API. Password-gated (CHAT_USER / CHAT_PASSWORD — set the password
  # when Render prompts; the app spends your Anthropic API budget, so never run
  # it public-facing without the gate). ANTHROPIC_API_KEY comes from
  # https://platform.claude.com — Render prompts for it on first deploy.
  # Conversations live in each user's browser, so no disk is needed.
  - type: web
    name: cardinal-chat
    runtime: docker
    branch: main
    dockerfilePath: ./deploy/Dockerfile.chat
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # Render prompts you to set this on first deploy
      - key: CHAT_USER
        value: admin
      - key: CHAT_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # The Cardinal — the social network (social/): profiles, feed, reactions,
  # photos, groups, messages, and the "Reach out" support signal. Node 22 with
  # no third-party dependencies (node:http + node:sqlite). Members' accounts and
  # posts persist in SQLite on the mounted disk, so a restart does not wipe the
  # network — that is why this runs on a paid instance rather than the free tier.
  #
  # SEED_EMAIL / SEED_PASSWORD are prompted rather than committed: they create
  # the founder account on first boot and must not be public repo defaults.
  #
  # To serve this at thecardinalpromise.com, add the domain in Settings ->
  # Custom Domains and point DNS at Render as it instructs.
  - type: web
    name: cardinal-social
    runtime: node
    branch: main
    rootDir: social
    plan: starter            # a persistent disk requires a paid instance
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: cardinal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEST_DB
        value: /data/nest.db
      - key: SEED_EMAIL
        sync: false            # Render prompts you to set this on first deploy
      - key: SEED_PASSWORD
        sync: false            # Render prompts you to set this on first deploy
