# Render blueprint — deploy this repo's services with no server to manage.
#
# One-time setup at https://render.com :
#   1. New +  ->  Blueprint  ->  connect this GitHub repo  ->  Apply.
#   2. Render provisions every service below in one pass. For Cardinal Books,
#      when prompted, set BOOKS_PASSWORD to a strong password (BOOKS_USER is
#      "admin" by default; change it here if you like).
#   3. Each service gets its own https://<name>-*.onrender.com URL.
#   4. (Optional) Add a custom domain per service in Settings -> Custom Domains,
#      then point a DNS CNAME at Render.
#
# HTTPS is automatic on every service. Cardinal Books (BOOKS_USER /
# BOOKS_PASSWORD) and Blue Ridge Tax (TAXFILE_USER / TAXFILE_PASSWORD) are
# password-gated and persist data on disks across deploys and restarts;
# Cardinal Care Bridge is a public static site with no login.

services:
  - type: web
    name: cardinal-books
    runtime: docker
    branch: main             # deploy from main (this work is merged there)
    plan: starter            # ~$7/mo; a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node deploy/allinone.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: books-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BUSINESS_NAME
        value: Blue Ridge Press LLC
      - key: ACCOUNTING_DB
        value: /data/accounting.db
      - key: BOOKS_USER
        value: admin
      - key: BOOKS_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Cardinal Care Bridge — the placement-business landing page (cardinal-care-bridge/).
  # A static site: no build step, no server, no disk, and free on Render (no `plan`
  # needed). Same one-time setup as above (Blueprint -> connect repo -> Apply) gives
  # you an https://cardinal-care-bridge-*.onrender.com URL; add a custom domain like
  # www.cardinalcarebridge.com the same way, in Settings -> Custom Domains.
  #
  # Before pointing real traffic at it: replace the placeholder email
  # (hello@cardinalcarebridge.example) and phone number in cardinal-care-bridge/index.html
  # with real contact details — see that folder's README for the full launch checklist.
  - type: web
    name: cardinal-care-bridge
    runtime: static
    branch: main
    staticPublishPath: ./cardinal-care-bridge
    autoDeploy: true

  # Cardinal Coverage — SNF Medicare Advantage management. Deployed as TWO
  # services on purpose.
  #
  # 1) The buyer-facing marketing page is a public static site (site/). Free on
  #    Render, no build step, no server.
  # 2) Everything else — the four working tools plus the investor deck and
  #    one-pager — sits behind HTTP Basic auth (app/, served by
  #    cardinal-coverage/deploy/server.mjs). It is gated because the tools are
  #    where resident data gets typed and there is no BAA behind them, and
  #    because the investor materials still contain FILL IN blocks that must not
  #    be indexed. Every gated page also carries a noindex meta and the server
  #    sends X-Robots-Tag: noindex.
  #
  # Set CC_PASSWORD when Render prompts on first deploy (CC_USER defaults to
  # "cardinal"). The service refuses to start without a password rather than
  # coming up ungated.
  - type: web
    name: cardinal-coverage
    runtime: static
    branch: main
    staticPublishPath: ./cardinal-coverage/site
    autoDeploy: true

  - type: web
    name: cardinal-coverage-app
    runtime: docker
    branch: main
    plan: starter
    dockerfilePath: ./cardinal-coverage/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CC_USER
        value: cardinal
      - key: CC_PASSWORD
        sync: false            # Render prompts you to set this on first deploy

  # Blue Ridge Tax — the TaxFile app (taxfile/): guided 2025 federal 1040 with
  # a live refund tracker and mock e-file. Password-gated (TAXFILE_USER /
  # TAXFILE_PASSWORD — set the password when Render prompts; returns contain
  # SSNs, so never run this public-facing without the gate). Return data
  # persists in SQLite on the mounted disk.
  - type: web
    name: blue-ridge-tax
    runtime: docker
    branch: main
    plan: starter            # a persistent disk requires a paid instance
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: node taxfile/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: tax-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRAND_NAME
        value: Blue Ridge Tax
      - key: TAXFILE_DB
        value: /data/taxfile.db
      - key: TAXFILE_USER
        value: admin
      - key: TAXFILE_PASSWORD
        sync: false            # Render prompts you to set this on first deploy
