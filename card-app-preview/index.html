<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Gold Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #0c1a33;
    --bg-bottom: #050b1a;
    --panel: #0b1a38;
    --panel-border: #1b2c4f;
    --text: #ffffff;
    --muted: #b9c8e6;
    --accent: #3d8bff;
    --divider: #22355b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-bottom);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 26px 6px 36px;
    font-weight: 600; font-size: 16px;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  main { flex: 1; padding: 0 16px 110px; overflow-y: auto; }
  .badge {
    display: inline-block; margin: 10px 0 0 4px;
    padding: 5px 11px; border-radius: 999px;
    background: #1a2a48; color: var(--muted); font-size: 13px;
  }
  .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-top: 10px;
  }
  .acct { color: var(--muted); font-size: 16px; margin-top: 2px; letter-spacing: 0.5px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid #3a4f78; background: #13223f;
    display: grid; place-items: center; margin-top: 18px; cursor: pointer;
  }
  .card {
    position: relative; width: 100%; aspect-ratio: 1.586;
    border-radius: 14px; margin: 14px 0 18px; padding: 7px;
    background: linear-gradient(135deg, #a8853a 0%, #f3dc95 28%, #c9a24f 52%, #f6e3a4 74%, #9c7a32 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    color: #2b2110; overflow: hidden;
  }
  .card-inner {
    position: relative; height: 100%; border-radius: 9px;
    border: 2px solid rgba(70,50,15,.55);
    outline: 1px solid rgba(70,50,15,.35); outline-offset: -6px;
    background:
      repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.12) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(60deg, rgba(90,65,20,.06) 0 1px, transparent 1px 9px);
  }
  .card .brand {
    position: absolute; top: 9%; width: 100%; text-align: center;
    font-family: "Source Serif 4", Georgia, serif; font-weight: 700;
    font-size: clamp(16px, 5.4vw, 23px); letter-spacing: 1px;
  }
  .card .brand small { display: block; font-size: .55em; letter-spacing: 6px; margin-top: 2px; }
  .card .chip {
    position: absolute; left: 9%; top: 34%; width: 13%; aspect-ratio: 1.3;
    border-radius: 6px; background: linear-gradient(135deg, #fff3cf, #d9bd78);
    border: 1px solid rgba(70,50,15,.5);
    background-image:
      linear-gradient(90deg, transparent 32%, rgba(70,50,15,.45) 32% 35%, transparent 35% 65%, rgba(70,50,15,.45) 65% 68%, transparent 68%),
      linear-gradient(0deg, transparent 47%, rgba(70,50,15,.45) 47% 53%, transparent 53%),
      linear-gradient(135deg, #fff3cf, #d9bd78);
  }
  .card .emblem { position: absolute; left: 50%; top: 30%; width: 26%; transform: translateX(-50%); }
  .card .since {
    position: absolute; right: 9%; top: 63%; text-align: center;
    font-size: clamp(9px, 2.6vw, 11px); letter-spacing: 1.5px; font-weight: 700;
  }
  .card .since b { display: block; font-size: 1.9em; letter-spacing: 0; margin-top: 2px; }
  .card .holder {
    position: absolute; left: 9%; bottom: 9%;
    font-family: "Source Serif 4", Georgia, serif; font-size: clamp(12px, 3.8vw, 16px); line-height: 1.25;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 20px;
  }
  .label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 17px; }
  .info {
    width: 19px; height: 19px; border-radius: 50%; border: 1.4px solid var(--muted);
    font: italic 600 11px Georgia, serif; display: grid; place-items: center; cursor: pointer;
  }
  .balance { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 12px 0 6px; }
  .sub { color: var(--muted); font-size: 16px; }
  hr { border: 0; border-top: 1px solid var(--divider); margin: 18px 0; }
  .small-balance { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .row {
    display: flex; align-items: center; gap: 22px;
    margin-top: 14px; padding: 18px 20px; text-decoration: none; color: var(--text);
    font-size: 17px; font-weight: 500;
  }
  .row:hover { border-color: #2c4677; }
  .row .chev { margin-left: auto; }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px;
    background: #050c1c; border-top: 1px solid #16233f;
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 10px 0 26px;
  }
  nav a {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); text-decoration: none; font-size: 12px; position: relative;
  }
  nav a.active { color: var(--accent); font-weight: 700; }
  nav a.active::after {
    content: ""; position: absolute; bottom: -9px; width: 40px; height: 3px;
    border-radius: 2px; background: var(--accent);
  }
  .home-bar {
    position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #fff;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>2:07</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.5c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.6 10.6 0 0 0 8.5.7 10.6 10.6 0 0 0 1 3.7l1.3 1.3a8.8 8.8 0 0 1 6.2-2.5zm0 3.6c1.4 0 2.7.5 3.6 1.4l1.3-1.3a7 7 0 0 0-9.8 0l1.3 1.3c.9-.9 2.2-1.4 3.6-1.4zm0 3.5c-.5 0-1 .2-1.3.6L8.5 11.5l1.3-1.3c-.3-.4-.8-.6-1.3-.6z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="1.5" height="4" rx=".7" fill="#fff" opacity=".5"/></svg>
    </span>
  </div>

  <main>
    <span class="badge">Concept preview</span>
    <div class="header">
      <div>
        <h1>Business Gold</h1>
        <div class="acct">••••1234</div>
      </div>
      <div class="avatar" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
      </div>
    </div>

    <div class="card" role="img" aria-label="Business Gold card">
      <div class="card-inner">
        <div class="brand">NORTHSTAR<small>BUSINESS</small></div>
        <div class="chip"></div>
        <svg class="emblem" viewBox="0 0 100 100" fill="none" stroke="#3a2c12" stroke-width="2.2">
          <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="40" stroke-width="1"/>
          <path d="M50 18 57 40h23L61.5 53.5 68.5 76 50 62 31.5 76l7-22.5L20 40h23z" fill="rgba(58,44,18,.15)"/>
        </svg>
        <div class="since">MEMBER SINCE<b>09</b></div>
        <div class="holder">ALEX MORGAN<br>NORTHWIND LLC</div>
      </div>
    </div>

    <section class="panel">
      <div class="label">Total Balance <span class="info">i</span></div>
      <div class="balance">-$1,368.00</div>
      <div class="sub">Payment not required at this time</div>
      <hr>
      <div class="label">Remaining Statement Balance <span class="info">i</span></div>
      <div class="small-balance">$0.00</div>
    </section>

    <a class="panel row" href="#">
      <svg width="30" height="36" viewBox="0 0 30 36" fill="none" stroke="#4b8eff" stroke-width="2"><path d="M4 2h15l8 8v22a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M19 2v8h8M8 16h14M8 21h14M8 26h10"/></svg>
      Statements and Activity
      <svg class="chev" width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#4b8eff" stroke-width="2"><path d="M2 2l6 6-6 6"/></svg>
    </a>

    <a class="panel row" href="#">
      <svg width="30" height="36" viewBox="0 0 30 36" fill="none" stroke="#4b8eff" stroke-width="2"><path d="M4 2h15l8 8v22a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M19 2v8h8"/><text x="5" y="27" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#4b8eff" stroke="none">PDF</text></svg>
      Sept activity PDF
      <svg class="chev" width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#4b8eff" stroke-width="2"><path d="M2 2l6 6-6 6"/></svg>
    </a>
  </main>

  <nav>
    <a href="#" class="active">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#3d8bff"><path d="M12 3 2 11.5h3V21h5v-6h4v6h5v-9.5h3z"/></svg>Home
    </a>
    <a href="#">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b9c8e6" stroke-width="1.5"><circle cx="12" cy="12" r="9.5"/><path d="m12 6.8 1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>Membership
    </a>
    <a href="#">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b9c8e6" stroke-width="1.5"><path d="M3 12.5V4a1 1 0 0 1 1-1h8.5L21 11.5 12.5 20z"/><circle cx="8" cy="8" r="1.5"/></svg>Offers
    </a>
    <a href="#">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b9c8e6" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>Account
    </a>
  </nav>
  <div class="home-bar"></div>
</div>
</body>
</html>
