AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CP17 CARD v2 pilot API and member registry

Parameters:
  StageName:
    Type: String
    Default: pilot
  CardContractAddress:
    Type: String
    Default: ''
    Description: Sepolia CARD v2 contract address. Leave blank until deployed.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        PARTICIPANTS_TABLE: !Ref ParticipantsTable
        CARD_CONTRACT_ADDRESS: !Ref CardContractAddress
        CHAIN_ID: '11155111'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cp17-${StageName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub cp17-web-${StageName}
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: CARD pilot administrators

  ParticipantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub cp17-participants-${StageName}
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: wallet
          AttributeType: S
      KeySchema:
        - AttributeName: wallet
          KeyType: HASH

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, OPTIONS]
      Auth:
        DefaultAuthorizer: CardJwt
        Authorizers:
          CardJwt:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ParticipantsTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /me
            Method: GET
        ParticipantsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /admin/participants
            Method: GET
        ParticipantsUpsert:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /admin/participants
            Method: POST

  AuditLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /cp17/${StageName}/audit
      RetentionInDays: 365

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ParticipantsTableName:
    Value: !Ref ParticipantsTable
  ContractAddress:
    Value: !Ref CardContractAddress
